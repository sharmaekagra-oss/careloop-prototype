<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="CareLoop patient prototype — a design sprint concept for chronic care coordination." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#1F5C52" />
<title>CareLoop — Patient Prototype</title>

<style>
/* ============================================================
   CareLoop prototype
   Palette, type and accessibility rules come from the
   CareLoop Brand Kit. The three brand colours double as the
   three adherence tiers:
     Deep Teal  = on track      (silent)
     Marigold   = gentle nudge  (passive reminder)
     Terracotta = check-in      (AI voice call)
   ============================================================ */

:root {
  --teal:        #1F5C52;
  --teal-deep:   #14403A;
  --teal-soft:   #E4EFED;
  --marigold:    #F2A93B;
  --marigold-soft:#FDF0D9;
  --marigold-ink:#8A5B08;
  --terracotta:  #D9714E;
  --terracotta-soft:#FBE5DC;
  --terracotta-ink:#8F3A1E;
  --cream:       #FBF3E7;
  --surface:     #FFFFFF;

  /* neutrals biased warm-teal, never pure grey */
  --ink:         #26332F;
  --ink-soft:    #5C6B65;
  --ink-faint:   #8A9691;
  --line:        #E7DCCB;
  --line-soft:   #F1E8DA;

  --shadow-sm: 0 2px 8px rgba(20, 64, 58, .07);
  --shadow-md: 0 6px 22px rgba(20, 64, 58, .12);
  --shadow-lg: 0 18px 50px rgba(20, 64, 58, .28);

  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;

  /* Baloo 2 / Poppins are the brand faces. Font CDNs are blocked in
     published artifacts, so these stacks resolve to the closest
     rounded + geometric system faces rather than failing silently. */
  --font-display: "Baloo 2", Nunito, "Segoe UI Rounded", "SF Pro Rounded",
                  ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  --font-body:    Poppins, "Segoe UI", system-ui, -apple-system, Roboto,
                  "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { font-size: 16px; }               /* raised by the text-size control */

body {
  margin: 0;
  background: #EFE4D2;                   /* ground behind the device */
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }

:focus-visible {
  outline: 3px solid var(--marigold);
  outline-offset: 2px;
  border-radius: 6px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* ---------- simulation rail (scaffolding, not product) ---------- */

.sim {
  max-width: 430px;
  margin: .9rem auto .8rem;
  padding: .7rem .85rem;
  display: flex;
  align-items: center;
  gap: .55rem;
  flex-wrap: wrap;
  border: 1.5px dashed #C9A45E;
  border-radius: var(--r-md);
  background: #F7EEDD;
}
.sim-tag {
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--marigold-ink);
  width: 100%;
}
.sim-clock {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.02rem;
  font-variant-numeric: tabular-nums;
  color: var(--teal-deep);
  margin-right: auto;
}
.sim button {
  font-size: .78rem;
  font-weight: 600;
  padding: .42em .8em;
  border-radius: 999px;
  background: var(--surface);
  border: 1.5px solid #DCC79B;
  color: var(--teal-deep);
}
.sim button:hover { background: #FFF8EA; }
.sim button[disabled] { opacity: .45; cursor: default; }

/* ---------- device shell ---------- */

.device {
  max-width: 430px;
  margin: 0 auto 1.4rem;
  background: var(--cream);
  border-radius: 34px;
  border: 10px solid #1B2521;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  height: 780px;
  max-height: calc(100vh - 130px);
  display: flex;
  flex-direction: column;
  position: relative;
}

.statusbar {
  flex: 0 0 auto;
  background: var(--teal);
  color: #fff;
  padding: .5rem .95rem;
  display: flex;
  align-items: center;
  gap: .5rem;
  font-size: .74rem;
  font-variant-numeric: tabular-nums;
}
.statusbar .sb-time { font-weight: 600; }
.statusbar .sb-right { margin-left: auto; display: flex; gap: .45rem; align-items: center; opacity: .9; }

.viewport {
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.pad { padding: 1rem .95rem 1.4rem; }

/* layers */
.layer-banner {
  position: absolute; top: 0; left: 0; right: 0;
  padding: .5rem;
  display: flex; flex-direction: column; gap: .45rem;
  pointer-events: none;
  z-index: 40;
}
.layer-overlay { position: absolute; inset: 0; z-index: 60; display: none; }
.layer-overlay.on { display: block; }

/* ---------- tab bar ---------- */

.tabbar {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.tab {
  padding: .6rem .2rem .7rem;
  display: flex; flex-direction: column; align-items: center; gap: .18rem;
  font-size: .68rem; font-weight: 600;
  color: var(--ink-faint);
}
.tab .ico { font-size: 1.15rem; line-height: 1; }
.tab.on { color: var(--teal); }
.tab .ico { transition: transform .15s ease; }
.tab.on .ico { transform: translateY(-1px); }

/* ---------- typography ---------- */

h1, h2, h3 { font-family: var(--font-display); color: var(--teal-deep); margin: 0; text-wrap: balance; }
h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
h2 { font-size: 1.16rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }

.eyebrow {
  font-size: .68rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-faint);
}
.muted { color: var(--ink-soft); font-size: .86rem; }
.tiny { font-size: .76rem; color: var(--ink-faint); }
.stack { display: flex; flex-direction: column; }
.gap-xs { gap: .35rem; } .gap-sm { gap: .6rem; }
.gap-md { gap: .9rem; }  .gap-lg { gap: 1.3rem; }
.row { display: flex; align-items: center; gap: .6rem; }
.between { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
.grow { flex: 1; min-width: 0; }

/* ---------- cards & controls ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 1rem;
  box-shadow: var(--shadow-sm);
}
.card.flat { box-shadow: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  padding: .82em 1.2em;
  border-radius: var(--r-sm);
  font-weight: 600;
  font-size: .95rem;
  transition: transform .08s ease, background .15s ease;
  text-align: center;
}
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:hover { background: var(--teal-deep); }
.btn-outline { background: var(--surface); color: var(--teal); border: 2px solid var(--teal); }
.btn-outline:hover { background: var(--teal-soft); }
.btn-accent { background: var(--marigold); color: #4A3208; }
.btn-quiet { background: var(--teal-soft); color: var(--teal-deep); }
.btn-ghost { color: var(--ink-soft); padding: .6em .8em; }
.btn-ghost:hover { color: var(--teal); }
.btn-block { width: 100%; }
.btn-sm { padding: .55em .9em; font-size: .85rem; }

/* ---------- tier ---------- */

.tier {
  border-radius: var(--r-lg);
  padding: 1.1rem 1.1rem 1.2rem;
  color: #fff;
  position: relative;
  overflow: hidden;
}
.tier-green  { background: linear-gradient(150deg, #2A7568, var(--teal-deep)); }
.tier-yellow { background: linear-gradient(150deg, #E9A03A, #C87F16); color: #3D2905; }
.tier-red    { background: linear-gradient(150deg, #DE7B58, #B4522F); }
.tier .t-eyebrow { font-size: .66rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .82; }
.tier .t-title { font-family: var(--font-display); font-size: 1.42rem; font-weight: 700; line-height: 1.15; margin-top: .15rem; }
.tier .t-body { font-size: .9rem; opacity: .93; margin-top: .3rem; }
.tier-ring {
  position: absolute; right: -26px; top: -26px;
  width: 116px; height: 116px; border-radius: 50%;
  border: 15px solid rgba(255,255,255,.13);
}

.pill {
  display: inline-flex; align-items: center; gap: .38em;
  padding: .3em .7em; border-radius: 999px;
  font-size: .76rem; font-weight: 700;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill-green  { background: var(--teal-soft); color: var(--teal); }
.pill-yellow { background: var(--marigold-soft); color: var(--marigold-ink); }
.pill-red    { background: var(--terracotta-soft); color: var(--terracotta-ink); }
.pill-plain  { background: var(--line-soft); color: var(--ink-soft); }
.pill-plain::before { display: none; }

/* ---------- dose rows ---------- */

.dose {
  display: flex; align-items: center; gap: .75rem;
  padding: .8rem 0;
  border-bottom: 1px solid var(--line-soft);
}
.dose:last-child { border-bottom: none; }
.dose-ico {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.2rem;
  background: var(--teal-soft); flex: 0 0 auto;
}
.dose-ico.risk { background: var(--terracotta-soft); }
.dose-name { font-weight: 600; font-size: .95rem; }
.dose-meta { font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.dose-act { display: flex; gap: .35rem; flex: 0 0 auto; }
.mark {
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-size: .95rem; font-weight: 700;
  flex: 0 0 auto;
}
.mark-taken  { background: var(--teal-soft); color: var(--teal); }
.mark-missed { background: var(--terracotta-soft); color: var(--terracotta-ink); }
.mark-wait   { background: var(--line-soft); color: var(--ink-faint); }

/* ---------- notifications ---------- */

.banner {
  pointer-events: auto;
  background: rgba(255,255,255,.97);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-left: 5px solid var(--marigold);
  border-radius: var(--r-md);
  padding: .7rem .8rem;
  box-shadow: var(--shadow-md);
  display: flex; gap: .6rem; align-items: flex-start;
  animation: drop .28s cubic-bezier(.2,.9,.3,1.2);
  text-align: left;
  width: 100%;
}
.banner.crit { border-left-color: var(--terracotta); }
.banner.calm { border-left-color: var(--teal); }
.banner-ico { font-size: 1.05rem; line-height: 1.2; }
.banner-title { font-weight: 700; font-size: .87rem; color: var(--teal-deep); }
.banner-body { font-size: .82rem; color: var(--ink-soft); }
.banner-time { font-size: .68rem; color: var(--ink-faint); margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }

.notif {
  display: flex; gap: .65rem; align-items: flex-start;
  padding: .8rem 0; border-bottom: 1px solid var(--line-soft);
}
.notif:last-child { border-bottom: none; }
.notif.unread .notif-title::after {
  content: ""; display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--terracotta); margin-left: .4em;
  vertical-align: middle;
}
.notif-title { font-weight: 600; font-size: .89rem; }
.notif-body { font-size: .82rem; color: var(--ink-soft); }

/* ---------- lock screen ---------- */

.lock {
  min-height: 100%;
  background:
    radial-gradient(120% 90% at 50% 0%, #2C6C60 0%, var(--teal-deep) 55%, #0E2E29 100%);
  color: #fff;
  padding: 2.2rem 1rem 1.2rem;
  display: flex; flex-direction: column; gap: 1rem;
}
.lock-time {
  font-family: var(--font-display); font-weight: 700;
  font-size: 3.5rem; line-height: 1; text-align: center;
  font-variant-numeric: tabular-nums;
}
.lock-date { text-align: center; opacity: .8; font-size: .9rem; margin-top: -.3rem; }
.lock-note {
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: var(--r-md);
  padding: .75rem .8rem;
  text-align: left;
  width: 100%;
  display: flex; gap: .6rem; align-items: flex-start;
  color: #fff;
}
.lock-note .nt { font-weight: 700; font-size: .86rem; }
.lock-note .nb { font-size: .81rem; opacity: .88; }
.lock-empty { text-align: center; opacity: .6; font-size: .85rem; padding: 1rem 0; }
.lock-cta { margin-top: auto; text-align: center; }
.lock-hint { font-size: .8rem; opacity: .7; margin-bottom: .6rem; }

/* ---------- AI call ---------- */

.call {
  min-height: 100%;
  background: linear-gradient(170deg, #1D4F47, #0C2A25);
  color: #fff;
  padding: 2rem 1.2rem 1.5rem;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.call-badge {
  font-size: .64rem; letter-spacing: .14em; text-transform: uppercase;
  font-weight: 700; background: rgba(242,169,59,.22); color: var(--marigold);
  padding: .35em .8em; border-radius: 999px; border: 1px solid rgba(242,169,59,.4);
}
.call-av {
  width: 96px; height: 96px; border-radius: 50%;
  background: linear-gradient(150deg, var(--marigold), #DA8E1E);
  display: grid; place-items: center; font-size: 2.4rem; color: #3D2905;
  margin: 1.5rem 0 .9rem;
  animation: ring 1.9s ease-in-out infinite;
}
@keyframes ring {
  0%,100% { box-shadow: 0 0 0 0 rgba(242,169,59,.45); }
  50%     { box-shadow: 0 0 0 18px rgba(242,169,59,0); }
}
.call-who { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.call-sub { font-size: .85rem; opacity: .75; margin-top: .15rem; }
.call-script {
  background: rgba(255,255,255,.1);
  border-radius: var(--r-md);
  padding: .9rem;
  font-size: .92rem;
  text-align: left;
  margin: 1.3rem 0;
  width: 100%;
  min-height: 5.5em;
}
.call-wave { display: flex; gap: 3px; align-items: flex-end; height: 18px; margin-bottom: .7rem; }
.call-wave i {
  width: 3px; background: var(--marigold); border-radius: 2px; height: 30%;
  animation: wv .9s ease-in-out infinite;
}
.call-wave i:nth-child(2){animation-delay:.1s} .call-wave i:nth-child(3){animation-delay:.2s}
.call-wave i:nth-child(4){animation-delay:.3s} .call-wave i:nth-child(5){animation-delay:.4s}
.call-wave i:nth-child(6){animation-delay:.5s} .call-wave i:nth-child(7){animation-delay:.6s}
@keyframes wv { 0%,100%{height:25%} 50%{height:100%} }
.call-acts { width: 100%; display: flex; flex-direction: column; gap: .55rem; margin-top: auto; }

/* ---------- onboarding / intro ---------- */

.ob { padding: 1.4rem 1.1rem 1.6rem; display: flex; flex-direction: column; gap: 1rem; min-height: 100%; }
.ob-steps { display: flex; gap: .3rem; }
.ob-steps i { height: 4px; border-radius: 2px; background: var(--line); flex: 1; }
.ob-steps i.on { background: var(--marigold); }
.ob-foot { margin-top: auto; display: flex; flex-direction: column; gap: .5rem; padding-top: .8rem; }

.field { display: flex; flex-direction: column; gap: .32rem; }
.field label { font-size: .82rem; font-weight: 600; color: var(--ink-soft); }
.field input, .field select, .field textarea {
  padding: .72em .8em;
  border: 1.5px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface);
  width: 100%;
}
.field textarea { min-height: 6em; resize: vertical; }

.choice {
  display: flex; gap: .45rem; flex-wrap: wrap;
}
.choice button {
  padding: .55em .9em; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface);
  font-size: .87rem; font-weight: 600; color: var(--ink-soft);
}
.choice button.on { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }

.toggle-row {
  display: flex; align-items: center; gap: .7rem;
  padding: .7rem 0; border-bottom: 1px solid var(--line-soft);
}
.toggle-row:last-child { border-bottom: none; }
.sw {
  width: 46px; height: 27px; border-radius: 999px; background: var(--line);
  position: relative; flex: 0 0 auto; transition: background .18s ease;
}
.sw::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 21px; height: 21px; border-radius: 50%; background: #fff;
  transition: transform .18s ease; box-shadow: var(--shadow-sm);
}
.sw.on { background: var(--teal); }
.sw.on::after { transform: translateX(19px); }

/* ---------- progress grid ---------- */

.wk { display: grid; grid-template-columns: 1fr repeat(7, 22px); gap: .3rem; align-items: center; }
.wk-h { font-size: .62rem; color: var(--ink-faint); text-align: center; font-weight: 600; }
.wk-lbl { font-size: .78rem; color: var(--ink-soft); }
.dot { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: .62rem; font-weight: 700; }
.dot-taken  { background: var(--teal); color: #fff; }
.dot-missed { background: var(--terracotta); color: #fff; }
.dot-none   { background: var(--line-soft); color: var(--ink-faint); }

.stat { display: flex; flex-direction: column; gap: .1rem; }
.stat b { font-family: var(--font-display); font-size: 1.5rem; color: var(--teal); font-variant-numeric: tabular-nums; line-height: 1; }

/* ---------- misc ---------- */

.file-row { display: flex; gap: .6rem; align-items: center; padding: .7rem 0; border-bottom: 1px solid var(--line-soft); }
.file-row:last-child { border-bottom: none; }
.code {
  font-family: var(--font-display); font-weight: 700;
  font-size: 2rem; letter-spacing: .2em; color: var(--teal);
  text-align: center; font-variant-numeric: tabular-nums;
}
.player { display: flex; gap: .75rem; align-items: center; background: var(--teal-soft); border-radius: var(--r-md); padding: .8rem; }
.player .pbtn { width: 46px; height: 46px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-size: 1rem; flex: 0 0 auto; }
.empty { text-align: center; color: var(--ink-faint); font-size: .87rem; padding: 1.6rem 0; }

.note-cal { background: var(--marigold-soft); border: 1px solid #EFD9A8; border-radius: var(--r-md); padding: .8rem; }

/* facilitator */
.fac { max-width: 430px; margin: 0 auto 2rem; }
.fac-in { border: 1.5px dashed #B98BA0; border-radius: var(--r-md); background: #FBF0F5; padding: .85rem; }
.fac h4 { font-size: .64rem; letter-spacing: .11em; text-transform: uppercase; color: #8E4D6E; margin: 0 0 .55rem; font-family: var(--font-body); font-weight: 700; }
.fac .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
.fac button {
  font-size: .78rem; font-weight: 600; padding: .5em .7em;
  border-radius: var(--r-sm); background: #fff; border: 1.5px solid #E0C3D2; color: #7A3F5C;
}
.fac button:hover { background: #FFF7FB; }
.fac .full { grid-column: 1 / -1; }

/* phone-width: drop the bezel, go full bleed */
@media (max-width: 520px) {
  body { background: var(--cream); }
  .device {
    border: none; border-radius: 0; height: auto;
    max-height: none; min-height: calc(100vh - 96px);
    margin-bottom: 0; box-shadow: none;
  }
  .sim { margin: 0; border-radius: 0; border-left: none; border-right: none; border-top: none; }
  .fac { padding: .8rem; }
}
</style>
</head>
<body>

<div id="sim"></div>

<div class="device">
  <div class="statusbar" id="statusbar"></div>
  <div class="viewport" id="viewport"></div>
  <div id="tabbar"></div>
  <div class="layer-banner" id="banners"></div>
  <div class="layer-overlay" id="overlay"></div>
</div>

<div class="fac" id="fac"></div>

<script>
(function () {
"use strict";

/* ============================================================
   1. Care plan data — from the CareLoop sprint documents
   ============================================================ */

var CLINIC = { name: "Sunrise Family Clinic", doctor: "Dr. Anand Rao", coordinator: "Priya Nair" };

var MEDS = [
  { id: "tel", name: "Telmisartan 40mg", why: "Blood pressure", icon: "❤️", risk: true,
    how: "One tablet, same time each day. Take it even if your blood pressure feels normal." },
  { id: "met", name: "Metformin 500mg", why: "Blood sugar", icon: "💊", risk: false,
    how: "One tablet with food. Taking it on an empty stomach can upset your stomach." }
];

/* four doses a day, minutes from midnight */
var SCHEDULE = [
  { medId: "tel", min: 8 * 60 },
  { medId: "met", min: 8 * 60 + 30 },
  { medId: "met", min: 20 * 60 + 30 },
  { medId: "tel", min: 21 * 60 }
];

var GRACE = 90;          // minutes after due before a dose counts as missed
var TODAY = 6;           // day index treated as "today" (days 0-5 are seeded history)
var START_MIN = 7 * 60;  // simulation opens at 07:00

var FILES = [
  { t: "Prescription", l: "Telmisartan + Metformin — current plan", d: "2 Aug" },
  { t: "Lab report",   l: "HbA1c & lipid panel",                        d: "28 Jul" },

];

var VISIT_NOTE =
  "Two things changed at this visit. First, your Telmisartan stays at the same dose — take it at " +

/* ============================================================
   2. State
   ============================================================ */

var KEY = "careloop_proto_v2";
var S;

function fresh() {
  return {
    phase: "intro",            // intro | onboarding | app
    step: 0,
    screen: "home",
    locked: false,
    profile: {
      name: "Radha",
      caregiver: "Meera",
      relation: "Daughter",
      gender: "f",
      accent: "in",
      voiceURI: null,
      textSize: 16,
      share: { alerts: true, reports: false, clinic: true }
    },
    day: TODAY,
    min: START_MIN,
    log: {},                   // "day:index" -> "taken" | "missed"
    seen: {},                  // "day:index" -> true once its due moment has passed
    tier: "green",
    streak: 0,
    notifs: [],
    events: [],
    alerts: [],                // caregiver alerts
    shares: [],
    call: null,
    stats: { pings: 0, standard: 0, silent: 0 },
    openMed: null,
    facOpen: false
  };
}

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return seed(fresh());
    var p = JSON.parse(raw);
    var base = fresh();
    for (var k in p) if (Object.prototype.hasOwnProperty.call(p, k)) base[k] = p[k];
    return base;
  } catch (e) { return seed(fresh()); }
}

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* A believable week behind the patient so Progress has something to show. */
function seed(st) {
  var misses = { "2:1": 1, "4:2": 1 };
  for (var d = 0; d < TODAY; d++) {
    for (var i = 0; i < SCHEDULE.length; i++) {
      var k = d + ":" + i;
      st.log[k] = misses[k] ? "missed" : "taken";
      st.seen[k] = true;
    }
  }
  return st;
}

/* ============================================================
   3. Time helpers
   ============================================================ */

function clock(m) {
  m = ((m % 1440) + 1440) % 1440;
  var h = Math.floor(m / 60), mm = m % 60;
  var ap = h < 12 ? "AM" : "PM";
  var hh = h % 12; if (hh === 0) hh = 12;
  return hh + ":" + (mm < 10 ? "0" : "") + mm + " " + ap;
}
function clock24(m) {
  m = ((m % 1440) + 1440) % 1440;
  var h = Math.floor(m / 60), mm = m % 60;
  return (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm;
}
function dayName(d) {
  var names = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  return names[d % 7];
}
function dayLabel(d) {
  if (d === S.day) return "Today";
  if (d === S.day - 1) return "Yesterday";
  return dayName(d);
}
function med(id) { for (var i = 0; i < MEDS.length; i++) if (MEDS[i].id === id) return MEDS[i]; return MEDS[0]; }
function uid() { return Math.random().toString(36).slice(2, 9); }

/* ============================================================
   4. Voice
   ============================================================ */

var voices = [], warmed = false;

function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  voices = window.speechSynthesis.getVoices() || [];
}
if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = function () { loadVoices(); };
}

var HINT_F = ["heera","zira","female","samantha","neerja","kalpana","aria","jenny","hazel","catherine","susan","fiona","tessa"];
var HINT_M = ["ravi","david","mark","male","daniel","george","guy","alex","james","ryan","prabhat","rishi"];

function pickVoice() {
  if (!voices.length) loadVoices();
  if (!voices.length) return null;
  var want = S.profile.accent === "in" ? "en-IN" : S.profile.accent === "gb" ? "en-GB" : "en-US";
  var pool = voices.filter(function (v) { return v.lang === want; });
  if (!pool.length) pool = voices.filter(function (v) { return (v.lang || "").indexOf("en") === 0; });
  if (!pool.length) pool = voices;
  var hints = S.profile.gender === "f" ? HINT_F : HINT_M;
  var hit = null;
  for (var i = 0; i < pool.length && !hit; i++) {
    var n = pool[i].name.toLowerCase();
    for (var j = 0; j < hints.length; j++) if (n.indexOf(hints[j]) !== -1) { hit = pool[i]; break; }
  }
  return hit || pool[0];
}

function voiceLabel() {
  var v = pickVoice();
  return v ? v.name : "no voice available on this device";
}

/* iOS/Safari only allow speech that descends from a real gesture; warm up on the first tap. */
function warmUp() {
  if (warmed || !("speechSynthesis" in window)) return;
  warmed = true;
  try {
    var u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function say(text) {
  if (!("speechSynthesis" in window)) return false;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}
function hush() { try { window.speechSynthesis.cancel(); } catch (e) {} }

/* ============================================================
   5. Notification engine
   ============================================================ */

function notify(o) {
  var n = {
    id: uid(), title: o.title, body: o.body,
    kind: o.kind || "calm", screen: o.screen || "home",
    day: S.day, min: S.min, read: false
  };
  S.notifs.unshift(n);
  if (S.notifs.length > 40) S.notifs.length = 40;
  S.stats.pings++;
  banner(n);
  save();
  return n;
}

/* Banners live outside render() so a re-render never restarts their animation. */
function banner(n) {
  var host = document.getElementById("banners");
  var el = document.createElement("button");
  el.className = "banner " + (n.kind === "crit" ? "crit" : n.kind === "calm" ? "calm" : "");
  el.setAttribute("data-act", "open-notif");
  el.setAttribute("data-id", n.id);
  el.innerHTML =
    '<span class="banner-ico">' + (n.kind === "crit" ? "📞" : "🔔") + '</span>' +
    '<span class="grow"><span class="banner-title">' + esc(n.title) + '</span>' +
    '<span class="banner-body" style="display:block">' + esc(n.body) + '</span></span>' +
    '<span class="banner-time">now</span>';
  host.appendChild(el);
  window.setTimeout(function () {
    if (el.parentNode) {
      el.style.transition = "opacity .3s ease, transform .3s ease";
      el.style.opacity = "0";
      el.style.transform = "translateY(-10px)";
      window.setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    }
  }, 6200);
}

function clearBanners() {
  var host = document.getElementById("banners");
  while (host.firstChild) host.removeChild(host.firstChild);
}

function logEvent(type, text) {
  S.events.unshift({ id: uid(), type: type, text: text, day: S.day, min: S.min });
  if (S.events.length > 80) S.events.length = 80;
}

/* ============================================================
   6. Tier engine
   ============================================================ */

function doseKey(d, i) { return d + ":" + i; }
function doseStatus(d, i) { return S.log[doseKey(d, i)] || "pending"; }

function todayDoses() {
  return SCHEDULE.map(function (s, i) {
    return { i: i, med: med(s.medId), min: s.min, status: doseStatus(S.day, i) };
  });
}

function setTier(t) { S.tier = t; }

function markDose(i, status) {
  var k = doseKey(S.day, i);
  S.log[k] = status;
  S.seen[k] = true;
  var m = med(SCHEDULE[i].medId);

  if (status === "taken") {
    S.streak = 0;
    setTier("green");
    logEvent("taken", m.name + " at " + clock(SCHEDULE[i].min) + " — taken");
  } else {
    onMiss(i);
  }
  save();
  render();
}

function onMiss(i) {
  var m = med(SCHEDULE[i].medId);
  S.streak++;
  logEvent("missed", m.name + " at " + clock(SCHEDULE[i].min) + " — missed");

  if (m.risk || S.streak >= 2) {
    setTier("red");
    startCall(i);
  } else {
    setTier("yellow");
    notify({
      title: "Still time for your " + m.name.split(" ")[0],
      body: "Your " + clock(SCHEDULE[i].min) + " dose isn't marked yet. Take it when you can.",
      kind: "warn", screen: "home"
    });
  }
}

function startCall(i) {
  var m = med(SCHEDULE[i].medId);
  var script =
    "Hello " + S.profile.name + ", this is your CareLoop check-in. This is an automated voice, not a person. " +
    "I noticed your " + m.name + " dose may not have been taken yet. Have you taken it?";
  S.call = { id: uid(), dose: i, script: script, spoken: false };
  logEvent("call", "AI check-in call placed about " + m.name);
  S.stats.pings++;
  save();
  render();
}

function answerCall(yes) {
  if (!S.call) return;
  var i = S.call.dose, m = med(SCHEDULE[i].medId);
  hush();
  if (yes) {
    S.log[doseKey(S.day, i)] = "taken";
    S.streak = 0;
    setTier("green");
    logEvent("confirmed", "Confirmed on the call — " + m.name + " taken");
    S.call = null;
    save(); render();
    notify({ title: "Thank you, that's logged", body: "You're back on track. No one else was notified.", kind: "calm", screen: "home" });
  } else {
    logEvent("escalated", "Not confirmed — " + S.profile.caregiver + " notified");
    S.alerts.unshift({
      id: uid(),
      text: S.profile.name + " may have missed her " + m.name + " dose and didn't confirm on the check-in call.",
      day: S.day, min: S.min, done: false
    });
    S.call = null;
    save(); render();
    if (S.profile.share.alerts) {
      notify({ title: S.profile.caregiver + " has been told", body: "Your " + S.profile.relation.toLowerCase() + " will check in with you shortly.", kind: "crit", screen: "home" });
    }
  }
}

function missesThisWeek() {
  var n = 0;
  for (var d = Math.max(0, S.day - 6); d <= S.day; d++)
    for (var i = 0; i < SCHEDULE.length; i++)
      if (doseStatus(d, i) === "missed") n++;
  return n;
}
function flagged() { return missesThisWeek() >= 3; }

/* ============================================================
   7. Simulated clock
   ============================================================ */

function processMoment() {
  var doses = SCHEDULE;
  for (var i = 0; i < doses.length; i++) {
    var k = doseKey(S.day, i);
    var due = doses[i].min;
    var st = S.log[k] || "pending";

    /* the dose comes due */
    if (S.min >= due && !S.seen[k]) {
      S.seen[k] = true;
      S.stats.standard++;                     // a conventional app pings here, every time
      if (S.tier === "green") {
        S.stats.silent++;                     // CareLoop stays quiet while on track
      } else {
        var m = med(doses[i].medId);
        notify({
          title: "Time for your " + m.name.split(" ")[0],
          body: clock(due) + " — " + m.why.toLowerCase() + ".",
          kind: "warn", screen: "home"
        });
      }
    }
    /* grace window runs out */
    if (S.min >= due + GRACE && st === "pending" && S.seen[k]) {
      S.log[k] = "missed";
      onMiss(i);
    }
  }
}

function step(mins) {
  var left = mins, guard = 0;
  while (left > 0 && guard++ < 400) {
    var chunk = Math.min(15, left);
    S.min += chunk;
    left -= chunk;
    if (S.min >= 1440) { S.min -= 1440; S.day++; rollDay(); }
    processMoment();
    if (S.call) break;             // a call interrupts the passage of time
  }
  save();
  render();
}

function rollDay() {
  S.streak = 0;
  if (S.tier !== "red") setTier("green");
  logEvent("day", "A new day begins");
}

/* next thing worth watching: a dose coming due, or a grace window closing */
function nextMoment() {
  var best = null;
  for (var i = 0; i < SCHEDULE.length; i++) {
    var k = doseKey(S.day, i), due = SCHEDULE[i].min;
    if (!S.seen[k] && due > S.min) best = best === null ? due : Math.min(best, due);
    if ((S.log[k] || "pending") === "pending" && due + GRACE > S.min)
      best = best === null ? due + GRACE : Math.min(best, due + GRACE);
  }
  return best;
}

function skipToNext() {
  var t = nextMoment();
  if (t === null) { step(1440 - S.min + START_MIN); return; }
  step(Math.max(15, t - S.min + 1));
}

/* ============================================================
   8. Rendering
   ============================================================ */

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

var TIER_COPY = {
  green:  { eyebrow: "On track", title: "Everything's on schedule", body: "CareLoop is logging quietly. We won't interrupt you while things are going well." },
  yellow: { eyebrow: "Gentle nudge", title: "One dose still open", body: "No rush and nothing to worry about — just take it when you get a moment." },
  red:    { eyebrow: "Check-in", title: "Let's check in", body: "A few doses have slipped. CareLoop will call to make sure you're alright." }
};

function tierCard() {
  var c = TIER_COPY[S.tier];
  return '<div class="tier tier-' + S.tier + '"><div class="tier-ring"></div>' +
    '<div class="t-eyebrow">' + esc(c.eyebrow) + '</div>' +
    '<div class="t-title">' + esc(c.title) + '</div>' +
    '<div class="t-body">' + esc(c.body) + '</div></div>';
}

function doseRow(d) {
  var late = S.min > d.min + GRACE;
  var open = S.min >= d.min;
  var right;
  if (d.status === "taken")       right = '<div class="mark mark-taken">✓</div>';
  else if (d.status === "missed") right = '<div class="mark mark-missed">!</div>';
  else if (open)
    right = '<div class="dose-act">' +
      '<button class="btn btn-primary btn-sm" data-act="take" data-i="' + d.i + '">Taken</button>' +
      '<button class="btn btn-ghost btn-sm" data-act="skip" data-i="' + d.i + '">Not yet</button></div>';
  else right = '<div class="mark mark-wait">·</div>';

  return '<div class="dose">' +
    '<div class="dose-ico' + (d.med.risk ? " risk" : "") + '">' + d.med.icon + '</div>' +
    '<div class="grow"><div class="dose-name">' + esc(d.med.name) + '</div>' +
    '<div class="dose-meta">' + clock(d.min) + " · " + esc(d.med.why) +
      (d.status === "missed" && late ? " · missed" : "") + '</div></div>' +
    right + '</div>';
}

          '<span class="nb" style="display:block">' + esc(n.body) + '</span></span></button>';
      }).join("") : '<div class="lock-empty">No notifications.<br />CareLoop stays quiet when things are on track.</div>') +
    '</div>' +
    '<div class="lock-cta"><div class="lock-hint">Tap to open CareLoop</div>' +

}

function scrHome() {
  var doses = todayDoses();
  var next = null;
  for (var i = 0; i < doses.length; i++)
    if (doses[i].status === "pending" && doses[i].min >= S.min) { next = doses[i]; break; }
  var open = doses.filter(function (d) { return d.status === "pending" && d.min <= S.min; });

  return '<div class="pad stack gap-md">' +
    '<div><div class="eyebrow">' + dayLabel(S.day) + " · " + clock(S.min) + '</div>' +
    '<h1>Good ' + (S.min < 720 ? "morning" : S.min < 1020 ? "afternoon" : "evening") + ', ' + esc(S.profile.name) + '</h1></div>' +

    tierCard() +

    (open.length ? '<div class="card stack gap-sm">' +
      '<div class="between"><h3>Ready when you are</h3><span class="pill pill-' + S.tier + '">' +
      esc(TIER_COPY[S.tier].eyebrow) + '</span></div>' +
      open.map(doseRow).join("") + '</div>' : "") +

    '<div class="card stack gap-sm">' +
      '<div class="between"><h3>' + dayLabel(S.day) + '’s medicines</h3>' +
      '<span class="tiny">' + doses.filter(function (d) { return d.status === "taken"; }).length +
      ' of ' + doses.length + ' taken</span></div>' +
      doses.map(doseRow).join("") +
    '</div>' +

    '<div class="card stack gap-sm">' +
      '<div class="eyebrow">From ' + esc(CLINIC.doctor) + '</div>' +
      '<h3>What changed at your visit</h3>' +
      '<div class="player"><button class="pbtn" data-act="play-note" aria-label="Play instructions">▶</button>' +
      '<span class="muted" style="font-size:.84rem">A 30-second voice note, in the voice you chose.</span></div>' +
      '<button class="btn btn-ghost btn-sm" data-act="go" data-s="note">Read it instead</button>' +
    '</div>' +

    (next ? '<p class="tiny">Next: ' + esc(next.med.name) + " at " + clock(next.min) + '</p>' : "") +
  '</div>';
}

function scrMeds() {
  if (S.openMed) {
    var m = med(S.openMed);
    var times = SCHEDULE.map(function (s, i) { return s.medId === m.id ? { i: i, min: s.min } : null; })
                        .filter(Boolean);
    return '<div class="pad stack gap-md">' +
      '<button class="btn btn-ghost btn-sm" data-act="go" data-s="meds" style="align-self:flex-start">← All medicines</button>' +
      '<div class="row gap-sm"><div class="dose-ico' + (m.risk ? " risk" : "") + '" style="width:52px;height:52px;font-size:1.5rem">' + m.icon + '</div>' +
      '<div><h1 style="font-size:1.25rem">' + esc(m.name) + '</h1><div class="muted">' + esc(m.why) + '</div></div></div>' +
      (m.risk ? '<div class="card flat" style="background:var(--terracotta-soft);border-color:#F0C4B3">' +
        '<div class="row gap-sm"><span>⚠️</span><span style="font-size:.86rem;color:var(--terracotta-ink)">' +
        'This one matters most. If a dose is missed, CareLoop calls straight away rather than waiting for a pattern.' +
        '</span></div></div>' : "") +
      '<div class="card stack gap-sm"><h3>How to take it</h3><p class="muted">' + esc(m.how) + '</p></div>' +
      '<div class="card stack gap-sm"><h3>Your times</h3>' +
        times.map(function (t) {
          return '<div class="between"><span class="muted">' + clock(t.min) + '</span>' +
            '<span class="pill pill-plain">' + esc(doseStatus(S.day, t.i)) + '</span></div>';
        }).join("") +
      '</div>' +
      '<div class="card stack gap-sm"><h3>Last 7 days</h3>' + weekGrid(m.id) + '</div>' +
    '</div>';
  }

  return '<div class="pad stack gap-md">' +
    '<h1>Your medicines</h1>' +
    '<p class="muted">Prescribed by ' + esc(CLINIC.doctor) + ' on 2 August.</p>' +
    MEDS.map(function (m) {
      var n = SCHEDULE.filter(function (s) { return s.medId === m.id; }).length;
      return '<button class="card" data-act="open-med" data-m="' + m.id + '" style="width:100%;text-align:left">' +
        '<div class="row gap-sm"><div class="dose-ico' + (m.risk ? " risk" : "") + '">' + m.icon + '</div>' +
        '<span class="grow"><span class="dose-name" style="display:block">' + esc(m.name) + '</span>' +
        '<span class="dose-meta">' + esc(m.why) + " · " + n + ' × daily</span></span>' +
        '<span class="muted">›</span></div></button>';
    }).join("") +
    '<div class="card stack gap-sm"><h3>Running low?</h3>' +
    '<p class="muted">Your pharmacy can see this plan with a one-time code. No repeat trips with a paper slip.</p>' +
    '<button class="btn btn-outline btn-block" data-act="go" data-s="file">Share with pharmacy</button></div>' +

function weekGrid(medId) {
  var idxs = [];
  for (var i = 0; i < SCHEDULE.length; i++) if (!medId || SCHEDULE[i].medId === medId) idxs.push(i);
  var days = [];
  for (var d = S.day - 6; d <= S.day; d++) days.push(d);

  var head = '<div class="wk"><span></span>' + days.map(function (d) {
    return '<span class="wk-h">' + dayName(d).slice(0, 1) + '</span>';
  }).join("");

  var rows = idxs.map(function (i) {
    return '<span class="wk-lbl">' + clock(SCHEDULE[i].min).replace(":00", "") + '</span>' +
      days.map(function (d) {
        var st = d < 0 ? "none" : doseStatus(d, i);
        var cls = st === "taken" ? "dot-taken" : st === "missed" ? "dot-missed" : "dot-none";
        var ch = st === "taken" ? "✓" : st === "missed" ? "!" : "";
        return '<span class="dot ' + cls + '" title="' + dayName(d) + '">' + ch + '</span>';
      }).join("");
  }).join("");

  return head + rows + '</div>';
}

function scrProgress() {
  var total = 0, taken = 0;
  for (var d = Math.max(0, S.day - 6); d <= S.day; d++)
    for (var i = 0; i < SCHEDULE.length; i++) {
      var st = doseStatus(d, i);
      if (st === "taken" || st === "missed") { total++; if (st === "taken") taken++; }
    }
  var pct = total ? Math.round((taken / total) * 100) : 100;

  return '<div class="pad stack gap-md">' +
    '<h1>How you\'re doing</h1>' +
    '<div class="card"><div class="row" style="gap:1.6rem">' +
      '<div class="stat"><b>' + pct + '%</b><span class="tiny">doses taken this week</span></div>' +
      '<div class="stat"><b>' + taken + '</b><span class="tiny">of ' + total + ' doses</span></div>' +
    '</div></div>' +

    '<div class="card stack gap-sm"><h3>Your week</h3>' + weekGrid(null) +
    '<div class="row gap-sm" style="margin-top:.5rem;flex-wrap:wrap">' +
      '<span class="row gap-xs"><span class="dot dot-taken" style="width:14px;height:14px"></span><span class="tiny">Taken</span></span>' +
      '<span class="row gap-xs"><span class="dot dot-missed" style="width:14px;height:14px"></span><span class="tiny">Missed</span></span>' +
      '<span class="row gap-xs"><span class="dot dot-none" style="width:14px;height:14px"></span><span class="tiny">Not yet</span></span>' +
    '</div></div>' +

    '<div class="card stack gap-sm"><h3>What CareLoop did about it</h3>' +
      '<div class="between"><span class="muted">Doses we let pass quietly</span><b class="grow" style="text-align:right;font-variant-numeric:tabular-nums">' + S.stats.silent + '</b></div>' +
      '<div class="between"><span class="muted">Times we got in touch</span><b class="grow" style="text-align:right;font-variant-numeric:tabular-nums">' + S.stats.pings + '</b></div>' +
      (S.stats.silent ? '<p class="tiny">An app that pings on every dose would have interrupted you ' +
        S.stats.silent + ' more ' + (S.stats.silent === 1 ? "time" : "times") + '.</p>' : "") +
    '</div>' +

    (S.events.length ? '<div class="card stack gap-sm"><h3>Recent activity</h3>' +
      S.events.slice(0, 7).map(function (e) {
        return '<div class="between"><span class="muted" style="font-size:.84rem">' + esc(e.text) + '</span>' +
          '<span class="tiny" style="white-space:nowrap">' + clock(e.min) + '</span></div>';
      }).join("") + '</div>' : "") +
  '</div>';
}

function statusbar() {

  var unread = S.notifs.filter(function (n) { return !n.read; }).length;
  return '<span class="sb-time">' + clock24(S.min) + '</span>' +
    '<span style="opacity:.75">' + dayLabel(S.day) + '</span>' +
    '<span class="sb-right">' +
      (unread ? '<span title="' + unread + ' unread">🔔 ' + unread + '</span>' : "") +
      '<span>▮▮▮</span></span>';
}

var TABS = [
  { id: "home",     ico: "🏠", label: "Home" },
  { id: "meds",     ico: "💊", label: "Medicines" },
  { id: "progress", ico: "📈", label: "Progress" },
  { id: "file",     ico: "📁", label: "File" }

function tabbar() {
  if (S.phase !== "app" || S.locked || S.call) return "";
  var main = ["home", "meds", "progress", "file"];
  return '<div class="tabbar">' + TABS.map(function (t) {
    var on = S.screen === t.id || (t.id === "home" && main.indexOf(S.screen) === -1);
    return '<button class="tab ' + (on ? "on" : "") + '" data-act="go" data-s="' + t.id + '">' +
      '<span class="ico">' + t.ico + '</span><span>' + t.label + '</span></button>';

}

function header() {
  /* a slim in-app header for notifications + settings */
  if (S.phase !== "app" || S.locked || S.call) return "";
  var unread = S.notifs.filter(function (n) { return !n.read; }).length;
  return '<div class="between" style="padding:.6rem .95rem 0">' +
    '<button class="row gap-xs" data-act="go" data-s="home" style="gap:.4rem">' + logoSvg(22) +
    '<span style="font-family:var(--font-display);font-weight:800;color:var(--teal);font-size:1.02rem">careloop</span></button>' +
    '<span class="row gap-xs">' +
    '<button class="btn btn-ghost btn-sm" data-act="go" data-s="notifs" aria-label="Notifications">🔔' +
      (unread ? ' <b style="color:var(--terracotta)">' + unread + '</b>' : "") + '</button>' +
    '<button class="btn btn-ghost btn-sm" data-act="go" data-s="settings" aria-label="Settings">⚙️</button>' +

function callOverlay() {

  o.innerHTML = '<div class="call">' +
    '<span class="call-badge">Automated voice · not a person</span>' +

  if (!S.call.spoken) { S.call.spoken = true; say(S.call.script); }

function simBar() {
  var host = document.getElementById("sim");

  host.innerHTML = '<div class="sim">' +
    '<span class="sim-tag">Simulation — not part of the app</span>' +

    '<button data-act="sim-hour">+1 hour</button>' +

function facPanel() {
  var host = document.getElementById("fac");
  var hash = (location.hash || "").toLowerCase();
  if (hash.indexOf("facilitator") === -1) { host.innerHTML = ""; return; }
  host.innerHTML = '<div class="fac-in">' +
    '<h4>Facilitator controls</h4>' +
    '<div class="grid">' +
      '<button data-act="fac-miss">Force a missed dose</button>' +
      '<button data-act="fac-call">Trigger check-in call</button>' +
      '<button data-act="fac-green">Reset to on-track</button>' +
      '<button data-act="fac-day">Skip a full day</button>' +
      '<button class="full" data-act="fac-scenario" data-v="pattern">Scenario: pattern of misses (clinic flag)</button>' +
      '<button class="full" data-act="restart">Wipe and restart</button>' +
    '</div>' +
    '<p class="tiny" style="margin-top:.5rem">Tier <b>' + S.tier + '</b> · streak ' + S.streak +
    ' · misses this week ' + missesThisWeek() + (flagged() ? " · clinic flagged" : "") +
    ' · alerts ' + S.alerts.filter(function (a) { return !a.done; }).length + '</p>' +
  '</div>';
}

function render() {
  document.documentElement.style.fontSize = S.profile.textSize + "px";

  var v = document.getElementById("viewport");
  var html;

  if (S.phase === "intro") html = scrIntro();
  else if (S.phase === "onboarding") html = scrOnboard();
  else if (S.locked) html = scrLock();
  else {
    var body =
      S.screen === "meds" ? scrMeds() :
      S.screen === "progress" ? scrProgress() :
      S.screen === "file" ? scrFile() :
      S.screen === "note" ? scrNote() :
      S.screen === "notifs" ? scrNotifs() :
      S.screen === "settings" ? scrSettings() :
      scrHome();
    html = header() + body;
  }

  v.innerHTML = html;
  document.getElementById("statusbar").innerHTML = statusbar();
  document.getElementById("statusbar").style.display = (S.phase === "app" && !S.locked) ? "flex" : "none";
  document.getElementById("tabbar").innerHTML = tabbar();
  simBar();
  facPanel();
  callOverlay();
}

/* ============================================================
   9. Interaction
   ============================================================ */

document.addEventListener("click", function (ev) {
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!el) return;
  var a = el.getAttribute("data-act");
  warmUp();

  /* --- intro / onboarding --- */
  if (a === "begin") { S.phase = "onboarding"; S.step = 0; save(); render(); return; }

  if (a === "ob-next") {
    if (S.step === 1) {
      var nm = document.getElementById("nm");
      if (nm && nm.value.trim()) S.profile.name = nm.value.trim().slice(0, 24);
    }
    if (S.step === 4) {
      var cg = document.getElementById("cg");
      if (cg && cg.value.trim()) S.profile.caregiver = cg.value.trim().slice(0, 24);
    }
    if (S.step >= OB_STEPS - 1) {
      S.phase = "app"; S.screen = "home"; S.locked = false;
      logEvent("setup", "Setup finished at the clinic");
      save(); render();
      notify({ title: "You're all set", body: "CareLoop will keep quiet unless something needs you.", kind: "calm", screen: "home" });
      return;
    }
    S.step++; save(); render(); return;
  }
  if (a === "ob-back") { if (S.step > 0) S.step--; save(); render(); return; }

  if (a === "v-gender") { S.profile.gender = el.getAttribute("data-v"); save(); render(); return; }
  if (a === "v-acc")    { S.profile.accent = el.getAttribute("data-v"); save(); render(); return; }
  if (a === "rel")      { S.profile.relation = el.getAttribute("data-v"); save(); render(); return; }
  if (a === "v-test")   {
    say("Hello " + S.profile.name + ", this is the CareLoop check-in voice. This is how I will sound when I call you.");
    return;
  }
  if (a === "share") {
    var k = el.getAttribute("data-k");
    S.profile.share[k] = !S.profile.share[k];
    save(); render(); return;
  }
  if (a === "tsize") { S.profile.textSize = parseInt(el.getAttribute("data-v"), 10); save(); render(); return; }

  /* --- navigation --- */
  if (a === "go") { S.screen = el.getAttribute("data-s"); S.openMed = null; save(); render(); return; }
  if (a === "open-med") { S.openMed = el.getAttribute("data-m"); S.screen = "meds"; save(); render(); return; }
  if (a === "unlock") { S.locked = false; save(); render(); return; }

  if (a === "open-notif") {
    var id = el.getAttribute("data-id");
    for (var i = 0; i < S.notifs.length; i++) if (S.notifs[i].id === id) {
      S.notifs[i].read = true;
      S.screen = S.notifs[i].screen || "home";
    }
    S.locked = false;
    clearBanners();
    save(); render(); return;
  }
  if (a === "clear-notifs") {
    for (var q = 0; q < S.notifs.length; q++) S.notifs[q].read = true;
    save(); render(); return;
  }

  /* --- doses --- */
  if (a === "take") { markDose(parseInt(el.getAttribute("data-i"), 10), "taken"); return; }
  if (a === "skip") { markDose(parseInt(el.getAttribute("data-i"), 10), "missed"); return; }

  /* --- call --- */
  if (a === "call-yes") { answerCall(true); return; }
  if (a === "call-no")  { answerCall(false); return; }
  if (a === "call-replay") { if (S.call) say(S.call.script); return; }

  /* --- misc --- */
  if (a === "play-note") { say(VISIT_NOTE); return; }
  if (a === "share-code") {
    var code = String(Math.floor(100000 + Math.random() * 900000));
    S.shares.unshift({ id: uid(), code: code, day: S.day, min: S.min });
    logEvent("share", "One-time code " + code + " sent by SMS");
    save(); render();
    notify({ title: "Code sent to your phone", body: "Read out " + code + " to share your file once.", kind: "calm", screen: "file" });
    return;
  }
  if (a === "restart") {
    hush();
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = seed(fresh());
    clearBanners();
    render();
    return;
  }

  /* --- simulation rail --- */
  if (a === "sim-hour") { step(60); return; }
  if (a === "sim-next") { skipToNext(); return; }
  if (a === "sim-lock") { S.locked = !S.locked; save(); render(); return; }

  /* --- facilitator --- */
  if (a === "fac-miss") {
    var doses = todayDoses(), target = -1;
    for (var z = 0; z < doses.length; z++) if (doses[z].status === "pending") { target = z; break; }
    if (target === -1) { S.day++; S.min = START_MIN; rollDay(); target = 0; }
    S.seen[doseKey(S.day, target)] = true;
    markDose(target, "missed");
    return;
  }
  if (a === "fac-call") {
    var d2 = todayDoses(), t2 = 0;
    for (var y = 0; y < d2.length; y++) if (d2[y].status === "pending") { t2 = y; break; }
    setTier("red"); startCall(t2); return;
  }
  if (a === "fac-green") { setTier("green"); S.streak = 0; save(); render(); return; }
  if (a === "fac-day")   { S.day++; S.min = START_MIN; rollDay(); save(); render(); return; }
  if (a === "fac-scenario") {
    S.log[doseKey(S.day - 2, 1)] = "missed";
    S.log[doseKey(S.day - 1, 2)] = "missed";
    S.log[doseKey(S.day, 0)] = "missed";
    S.seen[doseKey(S.day, 0)] = true;
    setTier("red"); S.streak = 2;
    logEvent("pattern", "Three misses inside a week — flagged to the clinic");
    save(); render(); return;
  }
});

window.addEventListener("hashchange", function () { facPanel(); });

/* ============================================================
   10. Boot
   ============================================================ */

S = load();
render();

/* voices arrive asynchronously in some browsers; refresh the label once they do */
if ("speechSynthesis" in window) {
  window.setTimeout(function () {
    loadVoices();
    if (S.phase === "onboarding" && S.step === 3) render();
    if (S.phase === "app" && S.screen === "settings") render();
  }, 700);
}

})();
</script>
