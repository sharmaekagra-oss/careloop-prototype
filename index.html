<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="CareLoop prototype — chronic care coordination across patient, caregiver, doctor, clinic, pharmacy and lab." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#1F5C52" />
<title>CareLoop — Prototype</title>

<style>
/* ============================================================
   CareLoop prototype
   Palette, type and accessibility rules from the CareLoop Brand Kit.
   The three brand colours double as the three adherence tiers:
     Deep Teal  = on track      (silent)
     Marigold   = gentle nudge  (passive reminder)
     Terracotta = check-in      (AI voice call)

   Six ends, one file. Role comes from ?role= in the URL.
   ============================================================ */

:root {
  --teal:#1F5C52; --teal-deep:#14403A; --teal-soft:#E4EFED; --teal-line:#C7DED8;
  --marigold:#F2A93B; --marigold-soft:#FDF0D9; --marigold-ink:#8A5B08;
  --terracotta:#D9714E; --terracotta-soft:#FBE5DC; --terracotta-ink:#8F3A1E;
  --cream:#FBF3E7; --surface:#FFFFFF;
  --ink:#26332F; --ink-soft:#5C6B65; --ink-faint:#8A9691;
  --line:#E7DCCB; --line-soft:#F1E8DA;
  --shadow-sm:0 2px 8px rgba(20,64,58,.07);
  --shadow-md:0 6px 22px rgba(20,64,58,.12);
  --shadow-lg:0 18px 50px rgba(20,64,58,.28);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --font-display:"Baloo 2",Nunito,"Segoe UI Rounded","SF Pro Rounded",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --font-body:Poppins,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box}
html{font-size:16px}
body{
  margin:0; background:#EFE4D2; color:var(--ink);
  font-family:var(--font-body); line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- shared atoms ---------- */
h1,h2,h3{font-family:var(--font-display);color:var(--teal-deep);margin:0;text-wrap:balance;line-height:1.22}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.16rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.muted{color:var(--ink-soft);font-size:.88rem}
.tiny{font-size:.76rem;color:var(--ink-faint)}
.stack{display:flex;flex-direction:column}
.g-xs{gap:.35rem}.g-sm{gap:.6rem}.g-md{gap:.9rem}.g-lg{gap:1.3rem}
.row{display:flex;align-items:center;gap:.6rem}
.between{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.grow{flex:1;min-width:0}
.wrapf{flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1rem;box-shadow:var(--shadow-sm)}
.card.flat{box-shadow:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.72em 1.1em;border-radius:var(--r-sm);font-weight:600;font-size:.93rem;transition:transform .08s ease,background .15s ease;text-align:center}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-deep)}
.btn-outline{background:var(--surface);color:var(--teal);border:2px solid var(--teal)}
.btn-outline:hover{background:var(--teal-soft)}
.btn-accent{background:var(--marigold);color:#4A3208}
.btn-quiet{background:var(--teal-soft);color:var(--teal-deep)}
.btn-danger{background:var(--terracotta);color:#fff}
.btn-ghost{color:var(--ink-soft);padding:.55em .8em}
.btn-ghost:hover{color:var(--teal)}
.btn-block{width:100%}
.btn-sm{padding:.5em .85em;font-size:.85rem}

.pill{display:inline-flex;align-items:center;gap:.38em;padding:.28em .68em;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-green{background:var(--teal-soft);color:var(--teal)}
.pill-yellow{background:var(--marigold-soft);color:var(--marigold-ink)}
.pill-red{background:var(--terracotta-soft);color:var(--terracotta-ink)}
.pill-plain{background:var(--line-soft);color:var(--ink-soft)}
.pill-plain::before{display:none}

.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.field input,.field select,.field textarea{padding:.62em .75em;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);width:100%}
.field textarea{min-height:5.5em;resize:vertical}
.inline{display:flex;gap:.5rem;flex-wrap:wrap}

.sw{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:var(--shadow-sm)}
.sw.on{background:var(--teal)}
.sw.on::after{transform:translateX(19px)}
.toggle-row{display:flex;align-items:center;gap:.7rem;padding:.7rem 0;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.toggle-row:last-child{border-bottom:none}

/* ---------- simulation rail ---------- */
.sim{
  max-width:430px;margin:.9rem auto .8rem;padding:.7rem .85rem;
  display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;
  border:1.5px dashed #C9A45E;border-radius:var(--r-md);background:#F7EEDD;
}
.sim.wide{max-width:1180px}
.sim-tag{font-size:.62rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--marigold-ink);width:100%}
.sim-clock{font-family:var(--font-display);font-weight:700;font-size:1.02rem;color:var(--teal-deep);margin-right:auto}
.sim button{font-size:.78rem;font-weight:600;padding:.42em .8em;border-radius:999px;background:var(--surface);border:1.5px solid #DCC79B;color:var(--teal-deep)}
.sim button:hover{background:#FFF8EA}
.sim a{font-size:.78rem;font-weight:600;padding:.42em .8em;border-radius:999px;background:var(--surface);border:1.5px solid #DCC79B;color:var(--teal-deep);text-decoration:none}
.sim a.on{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ============================================================
   PHONE SHELL  (patient, caregiver)
   ============================================================ */
.device{
  max-width:430px;margin:0 auto 1.4rem;background:var(--cream);
  border-radius:34px;border:10px solid #1B2521;box-shadow:var(--shadow-lg);
  overflow:hidden;height:780px;max-height:calc(100vh - 130px);
  display:flex;flex-direction:column;position:relative;
}
.statusbar{flex:0 0 auto;background:var(--teal);color:#fff;padding:.5rem .95rem;display:flex;align-items:center;gap:.5rem;font-size:.74rem}
.statusbar .sb-right{margin-left:auto;display:flex;gap:.45rem;align-items:center;opacity:.9}
.viewport{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:1rem .95rem 1.4rem}
.layer-banner{position:absolute;top:0;left:0;right:0;padding:.5rem;display:flex;flex-direction:column;gap:.45rem;pointer-events:none;z-index:40}
.layer-overlay{position:absolute;inset:0;z-index:60;display:none}
.layer-overlay.on{display:block}

.tabbar{flex:0 0 auto;display:grid;background:var(--surface);border-top:1px solid var(--line)}
.tab{padding:.6rem .2rem .7rem;display:flex;flex-direction:column;align-items:center;gap:.18rem;font-size:.66rem;font-weight:600;color:var(--ink-faint)}
.tab .ico{font-size:1.15rem;line-height:1}
.tab.on{color:var(--teal)}

/* ============================================================
   DESKTOP SHELL  (doctor, clinic, pharmacy, lab)
   ============================================================ */
.desk{
  max-width:1180px;margin:0 auto 2rem;background:var(--cream);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow-md);display:flex;flex-direction:column;
  min-height:640px;
}
.desk-top{
  background:var(--teal);color:#fff;padding:.7rem 1.1rem;
  display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;
}
.desk-top .wm{font-family:var(--font-display);font-weight:800;font-size:1.2rem}
.desk-top .ctx{font-size:.8rem;opacity:.85;padding-left:.8rem;border-left:1px solid rgba(255,255,255,.3)}
.desk-top .who{margin-left:auto;display:flex;align-items:center;gap:.55rem;font-size:.82rem}
.desk-top .av{width:30px;height:30px;border-radius:50%;background:var(--marigold);color:#3D2905;display:grid;place-items:center;font-weight:700;font-size:.78rem}
.desk-body{display:flex;flex:1;min-height:0;align-items:stretch}
.desk-side{
  flex:0 0 208px;background:var(--surface);border-right:1px solid var(--line);
  padding:.8rem .6rem;display:flex;flex-direction:column;gap:.15rem;
}
.desk-nav{
  display:flex;align-items:center;gap:.55rem;padding:.6rem .7rem;border-radius:var(--r-sm);
  font-size:.88rem;font-weight:600;color:var(--ink-soft);text-align:left;width:100%;
}
.desk-nav .ic{font-size:1rem}
.desk-nav:hover{background:var(--line-soft)}
.desk-nav.on{background:var(--teal-soft);color:var(--teal)}
.desk-nav .cnt{margin-left:auto;font-size:.72rem;font-weight:700;background:var(--terracotta);color:#fff;border-radius:999px;padding:.1em .45em}
.desk-main{flex:1;min-width:0;padding:1.3rem 1.4rem 2rem;overflow-y:auto}
.desk-h{margin-bottom:1.1rem}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.9rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem}

.tbl-wrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:.9rem}
table.dt th{text-align:left;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;padding:0 .7rem .55rem 0}
table.dt td{padding:.7rem .7rem .7rem 0;border-top:1px solid var(--line-soft);vertical-align:middle}
table.dt tr.click:hover td{background:var(--line-soft);cursor:pointer}
table.dt td.r,table.dt th.r{text-align:right;padding-right:0}

.stat{display:flex;flex-direction:column;gap:.1rem}
.stat b{font-family:var(--font-display);font-size:1.65rem;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--terracotta)}

.flagbox{border-radius:var(--r-md);padding:.75rem .85rem;font-size:.87rem}
.flag-red{background:var(--terracotta-soft);color:var(--terracotta-ink);border:1px solid #F0C4B3}
.flag-amber{background:var(--marigold-soft);color:var(--marigold-ink);border:1px solid #EFD9A8}
.flag-teal{background:var(--teal-soft);color:var(--teal-deep);border:1px solid var(--teal-line)}

@media (max-width:900px){
  .desk{border-radius:0;border-left:none;border-right:none;margin-bottom:0}
  .desk-body{flex-direction:column}
  .desk-side{flex:0 0 auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:.5rem}
  .desk-nav{white-space:nowrap;width:auto}
  .desk-nav .cnt{margin-left:.35rem}
  .desk-main{padding:1rem .9rem 2rem}
}

/* ---------- tier hero / doses (patient) ---------- */
.tier{border-radius:var(--r-lg);padding:1.1rem;color:#fff;position:relative;overflow:hidden}
.tier-green{background:linear-gradient(150deg,#2A7568,var(--teal-deep))}
.tier-yellow{background:linear-gradient(150deg,#E9A03A,#C87F16);color:#3D2905}
.tier-red{background:linear-gradient(150deg,#DE7B58,#B4522F)}
.tier .t-eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.82}
.tier .t-title{font-family:var(--font-display);font-size:1.4rem;font-weight:700;margin-top:.15rem}
.tier .t-body{font-size:.89rem;opacity:.93;margin-top:.3rem}
.tier-ring{position:absolute;right:-26px;top:-26px;width:116px;height:116px;border-radius:50%;border:15px solid rgba(255,255,255,.13)}

.dose{display:flex;align-items:center;gap:.75rem;padding:.8rem 0;border-bottom:1px solid var(--line-soft)}
.dose:last-child{border-bottom:none}
.dose-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;background:var(--teal-soft);flex:0 0 auto}
.dose-ico.risk{background:var(--terracotta-soft)}
.dose-name{font-weight:600;font-size:.94rem}
.dose-meta{font-size:.79rem;color:var(--ink-soft)}
.mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;font-weight:700;flex:0 0 auto}
.mark-taken{background:var(--teal-soft);color:var(--teal)}
.mark-missed{background:var(--terracotta-soft);color:var(--terracotta-ink)}
.mark-wait{background:var(--line-soft);color:var(--ink-faint)}

/* ---------- notifications ---------- */
.banner{pointer-events:auto;background:rgba(255,255,255,.97);border:1px solid var(--line);border-left:5px solid var(--marigold);border-radius:var(--r-md);padding:.7rem .8rem;box-shadow:var(--shadow-md);display:flex;gap:.6rem;align-items:flex-start;animation:drop .28s cubic-bezier(.2,.9,.3,1.2);text-align:left;width:100%}
.banner.crit{border-left-color:var(--terracotta)}
.banner.calm{border-left-color:var(--teal)}
.banner-title{font-weight:700;font-size:.86rem;color:var(--teal-deep)}
.banner-body{font-size:.81rem;color:var(--ink-soft)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.notif{display:flex;gap:.65rem;align-items:flex-start;padding:.8rem 0;border-bottom:1px solid var(--line-soft);width:100%;text-align:left}
.notif:last-child{border-bottom:none}
.notif.unread .notif-title::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--terracotta);margin-left:.4em;vertical-align:middle}
.notif-title{font-weight:600;font-size:.88rem}
.notif-body{font-size:.81rem;color:var(--ink-soft)}

.toastwrap{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:120;width:min(92vw,430px)}
.toast{background:var(--teal-deep);color:#fff;padding:.8em 1.05em;border-radius:var(--r-md);box-shadow:var(--shadow-md);font-size:.9rem;animation:drop .22s ease}

/* ---------- lock screen ---------- */
.lock{min-height:100%;background:radial-gradient(120% 90% at 50% 0%,#2C6C60 0%,var(--teal-deep) 55%,#0E2E29 100%);color:#fff;padding:2.2rem 1rem 1.2rem;display:flex;flex-direction:column;gap:1rem}
.lock-time{font-family:var(--font-display);font-weight:700;font-size:3.4rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.lock-date{text-align:center;opacity:.8;font-size:.9rem;margin-top:-.3rem}
.lock-note{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-md);padding:.75rem .8rem;text-align:left;width:100%;display:flex;gap:.6rem;align-items:flex-start;color:#fff}
.lock-empty{text-align:center;opacity:.6;font-size:.85rem;padding:1rem 0}
.lock-cta{margin-top:auto;text-align:center}

/* ---------- AI call ---------- */
.call{min-height:100%;background:linear-gradient(170deg,#1D4F47,#0C2A25);color:#fff;padding:2rem 1.2rem 1.5rem;display:flex;flex-direction:column;align-items:center;text-align:center}
.call-badge{font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;background:rgba(242,169,59,.22);color:var(--marigold);padding:.35em .8em;border-radius:999px;border:1px solid rgba(242,169,59,.4)}
.call-av{width:92px;height:92px;border-radius:50%;background:linear-gradient(150deg,var(--marigold),#DA8E1E);display:grid;place-items:center;font-size:2.3rem;color:#3D2905;margin:1.4rem 0 .9rem;animation:ring 1.9s ease-in-out infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(242,169,59,.45)}50%{box-shadow:0 0 0 18px rgba(242,169,59,0)}}
.call-who{font-family:var(--font-display);font-size:1.28rem;font-weight:700}
.call-script{background:rgba(255,255,255,.1);border-radius:var(--r-md);padding:.9rem;font-size:.91rem;text-align:left;margin:1.2rem 0;width:100%;min-height:5.2em}
.call-acts{width:100%;display:flex;flex-direction:column;gap:.5rem;margin-top:auto}

/* ---------- bottom sheet ---------- */
.sheet-wrap{position:absolute;inset:0;background:rgba(20,32,29,.5);display:flex;align-items:flex-end}
.sheet{background:var(--cream);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:1.2rem 1.1rem 1.3rem;width:100%;max-height:92%;overflow-y:auto;animation:rise .26s cubic-bezier(.2,.9,.3,1.05)}
@keyframes rise{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-opts{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}
.sheet-opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:.85rem .9rem;width:100%}
.sheet-opt:hover{border-color:var(--teal)}
.sheet-opt .so-t{font-weight:600;font-size:.92rem;display:block}
.sheet-opt .so-b{font-size:.79rem;color:var(--ink-soft);display:block}
.explain{background:var(--teal);color:#fff;border-radius:var(--r-md);padding:1rem;margin-top:.9rem}

/* ---------- onboarding ---------- */
.ob{padding:1.4rem 1.1rem 1.6rem;display:flex;flex-direction:column;gap:1rem;min-height:100%}
.ob-steps{display:flex;gap:.3rem}
.ob-steps i{height:4px;border-radius:2px;background:var(--line);flex:1}
.ob-steps i.on{background:var(--marigold)}
.ob-foot{margin-top:auto;display:flex;flex-direction:column;gap:.5rem;padding-top:.8rem}
.choice{display:flex;gap:.45rem;flex-wrap:wrap}
.choice button{padding:.52em .85em;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.86rem;font-weight:600;color:var(--ink-soft)}
.choice button.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}

/* ---------- misc ---------- */
.wk{display:grid;grid-template-columns:1fr repeat(7,22px);gap:.3rem;align-items:center}
.wk-h{font-size:.62rem;color:var(--ink-faint);text-align:center;font-weight:600}
.wk-lbl{font-size:.76rem;color:var(--ink-soft)}
.dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:.62rem;font-weight:700}
.dot-taken{background:var(--teal);color:#fff}
.dot-missed{background:var(--terracotta);color:#fff}
.dot-none{background:var(--line-soft);color:var(--ink-faint)}
.supply-bar{height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.supply-bar i{display:block;height:100%;background:var(--teal);border-radius:4px}
.supply-bar.low i{background:var(--terracotta)}
.player{display:flex;gap:.75rem;align-items:center;background:var(--teal-soft);border-radius:var(--r-md);padding:.8rem}
.player .pbtn{width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:1rem;flex:0 0 auto}
.file-row{display:flex;gap:.6rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line-soft)}
.file-row:last-child{border-bottom:none}
.code{font-family:var(--font-display);font-weight:700;font-size:1.9rem;letter-spacing:.2em;color:var(--teal);text-align:center;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--ink-faint);font-size:.87rem;padding:1.6rem 0}
.who-bar{padding:.7rem .95rem;background:var(--teal-soft);border-bottom:1px solid var(--teal-line)}
.who-bar .n{font-family:var(--font-display);font-weight:700;color:var(--teal-deep);font-size:1rem}
.who-bar .r{font-size:.75rem;color:var(--teal)}
.rolestrip{display:flex;gap:.3rem;padding:.45rem .5rem;background:#EFE7D9;border-bottom:1px solid var(--line);overflow-x:auto}
.rolestrip a{font-size:.73rem;font-weight:600;white-space:nowrap;padding:.36em .72em;border-radius:999px;color:var(--ink-soft);text-decoration:none}
.rolestrip a.on{background:var(--teal);color:#fff}

.fac{max-width:430px;margin:0 auto 2rem}
.fac.wide{max-width:1180px}
.fac-in{border:1.5px dashed #B98BA0;border-radius:var(--r-md);background:#FBF0F5;padding:.85rem}
.fac h4{font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:#8E4D6E;margin:0 0 .55rem;font-family:var(--font-body);font-weight:700}
.fac .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.fac button{font-size:.77rem;font-weight:600;padding:.5em .7em;border-radius:var(--r-sm);background:#fff;border:1.5px solid #E0C3D2;color:#7A3F5C}
.fac .full{grid-column:1/-1}

/* phone width */
@media (max-width:520px){
  html{height:100%}
  body{background:var(--cream);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  #sim{flex:0 0 auto}
  /* #shell sits between body and .device, so it has to pass the height down */
  #shell{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .device{flex:1 1 auto;min-height:0;height:auto;max-height:none;border:none;border-radius:0;margin:0;box-shadow:none}
  .sim{margin:0;border-radius:0;border-left:none;border-right:none;border-top:none}
  .fac{flex:0 0 auto;margin:0;padding:0;max-height:42vh;overflow-y:auto}
  .fac:not(:empty){padding:.8rem}
  body.deskmode{height:auto;display:block;overflow:visible}
}
</style>
</head>
<body>

<div id="sim"></div>
<div id="shell"></div>
<div class="fac" id="fac"></div>
<div id="toast"></div>

<script>
(function () {
"use strict";

/* ============================================================
   1. Catalog — drug and test facts (static reference data)
   ============================================================ */

var CLINIC  = { name:"Sunrise Family Clinic", doctor:"Dr. Anand Rao", coordinator:"Priya Nair" };
var PHARMACY= { name:"Sunrise Pharmacy", staff:"Imran Qureshi" };
var LAB     = { name:"Sunrise Diagnostics", staff:"Vidya Menon" };

var MEDS = {
  tel:{ id:"tel", name:"Telmisartan", why:"Blood pressure", icon:"❤️", risk:true,
    how:"One tablet, same time each day. Take it even if your blood pressure feels normal.",
    whyContinue:"Blood pressure medicine works by holding your pressure down every single day. "+
      "Feeling well is a sign it is working — not a sign you can stop. If you stop, your pressure "+
      "usually climbs back within a few days, and most people feel nothing at all while it does." },
  met:{ id:"met", name:"Metformin", why:"Blood sugar", icon:"💊", risk:false,
    how:"One tablet with food. Taking it on an empty stomach can upset your stomach.",
    whyContinue:"Metformin keeps your sugar steady over months, not hours. You won't feel it working, "+
      "and you won't feel it wear off — but your levels drift back up quietly. Please speak to "+
      "Dr. Rao before stopping, rather than stopping first." },
  ator:{ id:"ator", name:"Atorvastatin", why:"Cholesterol", icon:"🫀", risk:false,
    how:"One tablet at night, with or without food.",
    whyContinue:"Cholesterol medicine has no day-to-day feeling attached to it. The benefit builds "+
      "over years and disappears within weeks of stopping." }
};
var MED_LIST = ["tel","met","ator"];

var TESTS = ["HbA1c","Lipid profile","Serum creatinine","Fasting blood sugar","Liver function"];

var GRACE = 90;
var TODAY = 6;
var START_MIN = 7*60;
var REFILL_DAYS = 4;
var NAG_EVERY = 30;
var APPOINTMENT = { label:"Follow-up with Dr. Rao", day:TODAY+2, min:11*60 };

/* other people on the professional dashboards, so a roster looks like a roster */
var OTHERS = [
  { name:"Suresh Pillai",  age:64, cond:"Hypertension",            tier:"green",  note:"Steady" },
  { name:"Fatima Sheikh",  age:71, cond:"Diabetes · CKD",          tier:"yellow", note:"1 missed dose" },
  { name:"Joseph Mathew",  age:58, cond:"Post-MI · Hypertension",  tier:"green",  note:"Steady" },
  { name:"Lakshmi Rao",    age:66, cond:"Diabetes",                tier:"red",    note:"4 missed this week" }
];
var OTHER_REFILLS = [
  { who:"Fatima Sheikh", item:"Metformin 500mg", status:"ready", code:"418302" },
  { who:"Joseph Mathew", item:"Aspirin 75mg",    status:"collected", code:"771264" }
];
var OTHER_LABS = [
  { who:"Suresh Pillai", test:"Lipid profile", status:"collected" },
  { who:"Lakshmi Rao",   test:"HbA1c",         status:"resulted", result:"8.4% — raised" }
];

/* ============================================================
   2. State
   ============================================================ */

var KEY = "careloop_proto_v4";
var S;

function fresh() {
  return {
    phase:"intro", step:0, screen:"home", locked:false, mode:"tiered",
    profile:{ name:"Radha", caregiver:"Meera", relation:"Daughter",
              gender:"f", accent:"in", textSize:16,
              share:{ alerts:true, reports:false, clinic:true } },
    cgPrefs:{ missed:true, weekly:true, quiet:false },
    day:TODAY, min:START_MIN,

    /* the care plan now lives in state — this is what the doctor edits */
    plan:[
      { slot:"s1", medId:"tel", min:8*60,    strength:"40mg" },
      { slot:"s2", medId:"met", min:8*60+30, strength:"500mg" },
      { slot:"s3", medId:"met", min:20*60+30,strength:"500mg" },
      { slot:"s4", medId:"tel", min:21*60,   strength:"40mg" }
    ],
    planVersion:1,
    planNote:"",

    log:{}, seen:{}, tier:"green", streak:0,
    notifs:[], events:[], alerts:[], shares:[], call:null,
    stats:{ pings:0, silent:0 },
    supply:{ tel:7, met:30, ator:0 },
    refillWarned:{},
    refills:[],        /* {id, medId, code, status:requested|ready|collected, day, min} */
    labOrders:[],      /* {id, test, status:ordered|booked|collected|resulted, result, day} */
    files:[
      { t:"Prescription", l:"Telmisartan + Metformin — current plan", d:"2 Aug" },
      { t:"Lab report",   l:"HbA1c & lipid panel",                    d:"28 Jul" },
      { t:"Lab report",   l:"Blood pressure log — clinic visit",      d:"28 Jul" },
      { t:"Visit note",   l:"Consultation summary — Dr. Rao",         d:"2 Aug" }
    ],
    visitNote:"Two things changed at this visit. First, your Telmisartan stays at the same dose — take it at "+
      "the same time every day, even when you feel fine. Second, an evening Metformin has been added — "+
      "take it with your dinner, not on an empty stomach. Your next check-up is in six weeks. "+
      "Call the clinic if you feel dizzy or unusually tired.",
    reason:null, selfStop:null, concerns:[], apptMissed:false,
    openMed:null, dscreens:{}, openPatient:false
  };
}

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return seed(fresh());
    var p = JSON.parse(raw), base = fresh();
    for(var k in p) if(Object.prototype.hasOwnProperty.call(p,k)) base[k]=p[k];
    return base;
  }catch(e){ return seed(fresh()); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function seed(st){
  var misses = { "2:s2":1, "4:s3":1 };
  for(var d=0; d<TODAY; d++){
    for(var i=0;i<st.plan.length;i++){
      var k = d+":"+st.plan[i].slot;
      st.log[k] = misses[k] ? "missed" : "taken";
      st.seen[k] = true;
    }
  }
  return st;
}

/* ============================================================
   3. Role routing
   ============================================================ */

var ROLES = {
  patient:  { label:"Patient",   who:function(){return S.profile.name+" Iyer";},         sub:"Patient",            shell:"phone" },
  caregiver:{ label:"Caregiver", who:function(){return S.profile.caregiver+" Iyer";},    sub:"Family caregiver",   shell:"phone" },
  doctor:   { label:"Doctor",    who:function(){return CLINIC.doctor;},                  sub:CLINIC.name,          shell:"desk" },
  clinic:   { label:"Clinic",    who:function(){return CLINIC.coordinator;},             sub:CLINIC.name,          shell:"desk" },
  pharmacy: { label:"Pharmacy",  who:function(){return PHARMACY.staff;},                 sub:PHARMACY.name,        shell:"desk" },
  lab:      { label:"Lab",       who:function(){return LAB.staff;},                      sub:LAB.name,             shell:"desk" }
};

function role(){
  var m = /[?&]role=([a-z]+)/i.exec(location.search);
  var r = m ? m[1].toLowerCase() : "patient";
  return ROLES[r] ? r : "patient";
}
function isFac(){
  return (location.hash||"").toLowerCase().indexOf("facilitator") !== -1 ||
         /[?&]fac=1/.test(location.search);
}
function roleLink(r){
  return "?role="+r+(isFac()?"&fac=1":"")+(isFac()?"#facilitator":"");
}

/* ============================================================
   4. Time
   ============================================================ */

function clock(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60),mm=m%60,ap=h<12?"AM":"PM",hh=h%12; if(hh===0)hh=12;
  return hh+":"+(mm<10?"0":"")+mm+" "+ap; }
function clock24(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60),mm=m%60;
  return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm; }
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function dayName(d){ return DAYS[((d%7)+7)%7]; }
function dayLabel(d){ if(d===S.day)return "Today"; if(d===S.day-1)return "Yesterday"; return dayName(d); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function med(id){ return MEDS[id] || MEDS.tel; }
function slotOf(id){ for(var i=0;i<S.plan.length;i++) if(S.plan[i].slot===id) return S.plan[i]; return null; }
function medLabel(p){ return med(p.medId).name+" "+p.strength; }

/* ============================================================
   5. Voice
   ============================================================ */

var voices=[], warmed=false;
function loadVoices(){ if(!("speechSynthesis" in window))return; voices=window.speechSynthesis.getVoices()||[]; }
if("speechSynthesis" in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=function(){loadVoices();}; }
var HF=["heera","zira","female","samantha","neerja","kalpana","aria","jenny","hazel","catherine","susan","fiona","tessa"];
var HM=["ravi","david","mark","male","daniel","george","guy","alex","james","ryan","prabhat","rishi"];
function pickVoice(){
  if(!voices.length) loadVoices();
  if(!voices.length) return null;
  var want = S.profile.accent==="in"?"en-IN":S.profile.accent==="gb"?"en-GB":"en-US";
  var pool = voices.filter(function(v){return v.lang===want;});
  if(!pool.length) pool = voices.filter(function(v){return (v.lang||"").indexOf("en")===0;});
  if(!pool.length) pool = voices;
  var hints = S.profile.gender==="f"?HF:HM, hit=null;
  for(var i=0;i<pool.length&&!hit;i++){ var n=pool[i].name.toLowerCase();
    for(var j=0;j<hints.length;j++) if(n.indexOf(hints[j])!==-1){ hit=pool[i]; break; } }
  return hit||pool[0];
}
function voiceLabel(){ var v=pickVoice(); return v?v.name:"no voice available on this device"; }
function warmUp(){ if(warmed||!("speechSynthesis" in window))return; warmed=true;
  try{ var u=new SpeechSynthesisUtterance(" "); u.volume=0; window.speechSynthesis.speak(u);}catch(e){} }
function say(t){ if(!("speechSynthesis" in window))return false;
  try{ window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); var v=pickVoice();
    if(v){u.voice=v;u.lang=v.lang;} u.rate=.92; window.speechSynthesis.speak(u); return true; }catch(e){return false;} }
function hush(){ try{window.speechSynthesis.cancel();}catch(e){} }

/* ============================================================
   6. Notifications
   ============================================================ */

function notify(o){
  var n={ id:uid(), title:o.title, body:o.body, kind:o.kind||"calm",
          screen:o.screen||"home", to:o.to||"patient", day:S.day, min:S.min, read:false };
  S.notifs.unshift(n);
  if(S.notifs.length>40) S.notifs.length=40;
  if(n.to==="patient") S.stats.pings++;
  if(role()===n.to) banner(n);
  save();
  return n;
}
function banner(n){
  var host=document.getElementById("banners");
  if(!host) return;
  var el=document.createElement("button");
  el.className="banner "+(n.kind==="crit"?"crit":n.kind==="calm"?"calm":"");
  el.setAttribute("data-act","open-notif"); el.setAttribute("data-id",n.id);
  el.innerHTML='<span>'+(n.kind==="crit"?"📞":"🔔")+'</span><span class="grow">'+
    '<span class="banner-title">'+esc(n.title)+'</span>'+
    '<span class="banner-body" style="display:block">'+esc(n.body)+'</span></span>';
  host.appendChild(el);
  window.setTimeout(function(){ if(el.parentNode){ el.style.opacity="0";
    window.setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },300); } },6200);
}
function clearBanners(){ var h=document.getElementById("banners"); if(h) while(h.firstChild) h.removeChild(h.firstChild); }

var toastT=null;
function toast(msg){
  var host=document.getElementById("toast");
  host.innerHTML='<div class="toastwrap"><div class="toast">'+esc(msg)+'</div></div>';
  clearTimeout(toastT);
  toastT=setTimeout(function(){ host.innerHTML=""; },3000);
}

function logEvent(type,text){
  S.events.unshift({ id:uid(), type:type, text:text, day:S.day, min:S.min });
  if(S.events.length>90) S.events.length=90;
}

/* ============================================================
   7. Tier engine
   ============================================================ */

function dkey(d,slot){ return d+":"+slot; }
function doseStatus(d,slot){ return S.log[dkey(d,slot)]||"pending"; }
function todayDoses(){
  return S.plan.slice().sort(function(a,b){return a.min-b.min;}).map(function(p){
    return { p:p, med:med(p.medId), min:p.min, status:doseStatus(S.day,p.slot) };
  });
}
function perDay(medId){ var n=0; for(var i=0;i<S.plan.length;i++) if(S.plan[i].medId===medId) n++; return n||1; }
function daysLeft(medId){ var l=S.supply[medId]; if(typeof l!=="number")return 99; return Math.floor(l/perDay(medId)); }
function hasOpenRefill(medId){
  for(var i=0;i<S.refills.length;i++) if(S.refills[i].medId===medId && S.refills[i].status!=="collected") return true;
  return false;
}
function checkRefill(medId){
  var d=daysLeft(medId);
  if(d>REFILL_DAYS || S.refillWarned[medId] || hasOpenRefill(medId)) return;
  S.refillWarned[medId]=true;
  var m=med(medId);
  logEvent("refill", m.name+" running low — "+d+" days left");
  notify({ title:m.name+" is running low",
           body:"About "+d+" day"+(d===1?"":"s")+" left. Order now so you don't run out.",
           kind:"warn", screen:"meds" });
}

function markDose(slot,status){
  var k=dkey(S.day,slot), p=slotOf(slot);
  if(!p) return;
  S.log[k]=status; S.seen[k]=true;
  if(status==="taken"){
    S.streak=0; setTier("green");
    if(typeof S.supply[p.medId]==="number" && S.supply[p.medId]>0) S.supply[p.medId]--;
    logEvent("taken", medLabel(p)+" at "+clock(p.min)+" — taken");
    save(); checkRefill(p.medId);
  } else { onMiss(slot); }
  save(); render();
}
function setTier(t){ S.tier=t; }

function onMiss(slot){
  var p=slotOf(slot); if(!p) return;
  var m=med(p.medId);
  S.streak++;
  logEvent("missed", medLabel(p)+" at "+clock(p.min)+" — missed");
  if(m.risk || S.streak>=2){ setTier("red"); startCall(slot); }
  else{
    setTier("yellow");
    notify({ title:"Still time for your "+m.name,
             body:"Your "+clock(p.min)+" dose isn't marked yet. Take it when you can.",
             kind:"warn", screen:"home" });
  }
}

function startCall(slot){
  var p=slotOf(slot); if(!p) return;
  S.call={ id:uid(), slot:slot, spoken:false,
    script:"Hello "+S.profile.name+", this is your CareLoop check-in. This is an automated voice, not a person. "+
      "I noticed your "+medLabel(p)+" dose may not have been taken yet. Have you taken it?" };
  logEvent("call","AI check-in call placed about "+medLabel(p));
  S.stats.pings++;
  save();
}

function answerCall(ans){
  if(!S.call) return;
  var slot=S.call.slot, p=slotOf(slot), m=med(p.medId);
  hush();
  if(ans==="better"){ S.call=null; giveReason(slot,"better"); return; }
  if(ans===true){
    S.log[dkey(S.day,slot)]="taken"; S.streak=0; setTier("green");
    if(typeof S.supply[p.medId]==="number" && S.supply[p.medId]>0) S.supply[p.medId]--;
    logEvent("confirmed","Confirmed on the call — "+medLabel(p)+" taken");
    S.call=null; save(); render();
    notify({ title:"Thank you, that's logged", body:"You're back on track. No one else was notified.", kind:"calm" });
  } else {
    logEvent("escalated","Not confirmed — "+S.profile.caregiver+" notified");
    S.alerts.unshift({ id:uid(), kind:"missed",
      text:S.profile.name+" may have missed her "+medLabel(p)+" dose and didn't confirm on the check-in call.",
      day:S.day, min:S.min, done:false });
    S.call=null; save(); render();
    if(S.profile.share.alerts){
      notify({ title:S.profile.caregiver+" has been told",
               body:"Your "+S.profile.relation.toLowerCase()+" will check in with you shortly.", kind:"crit" });
      notify({ title:S.profile.name+" may have missed a dose",
               body:"She didn't confirm on the check-in call.", kind:"crit", to:"caregiver" });
    }
  }
}

/* why a dose was skipped */
function giveReason(slot,why){
  var p=slotOf(slot); if(!p) return;
  var m=med(p.medId);
  S.reason=null;
  if(why==="better"){
    S.selfStop={ medId:p.medId, slot:slot };
    S.log[dkey(S.day,slot)]="missed"; S.seen[dkey(S.day,slot)]=true;
    logEvent("self-stop","Said she feels better and is thinking of stopping "+m.name);
    S.alerts.unshift({ id:uid(), kind:"self-stop",
      text:S.profile.name+" says she feels better and may stop her "+m.name+
        ". This is the risky one — she isn't forgetting, she thinks she's finished.",
      day:S.day, min:S.min, done:false });
    notify({ title:S.profile.name+" may stop her "+m.name,
             body:"She believes the course is finished. Needs a conversation, not a reminder.",
             kind:"crit", to:"caregiver" });
    save(); render(); return;
  }
  if(why==="unwell"){
    S.concerns.unshift({ id:uid(), medId:p.medId, day:S.day, min:S.min,
      text:m.name+" may be making her feel unwell" });
    S.log[dkey(S.day,slot)]="missed"; S.seen[dkey(S.day,slot)]=true;
    logEvent("concern","Reported feeling unwell after "+m.name);
    setTier("yellow"); save(); render();
    notify({ title:"Thank you for telling us",
             body:"We've let "+CLINIC.name+" know. Don't stop on your own — they'll call you.", kind:"crit" });
    return;
  }
  onMiss(slot); save(); render();
}

function ackSelfStop(ok){
  var m = S.selfStop?med(S.selfStop.medId):null;
  var slot = S.selfStop?S.selfStop.slot:null;
  S.selfStop=null;
  if(ok && m && slot){
    S.log[dkey(S.day,slot)]="taken"; S.streak=0; setTier("green");
    if(typeof S.supply[m.id]==="number" && S.supply[m.id]>0) S.supply[m.id]--;
    logEvent("resumed","Heard why it continues and took the "+m.name+" dose");
    save(); render();
    notify({ title:"Good — that's logged", body:"Keep going as prescribed until Dr. Rao says otherwise.", kind:"calm" });
  } else {
    logEvent("declined","Still intends to stop — clinic notified");
    setTier("red"); save(); render();
    notify({ title:CLINIC.name+" has been told", body:"Someone will call to talk it through before you stop.", kind:"crit" });
  }
}

function missesThisWeek(){
  var n=0;
  for(var d=Math.max(0,S.day-6); d<=S.day; d++)
    for(var i=0;i<S.plan.length;i++)
      if(doseStatus(d,S.plan[i].slot)==="missed") n++;
  return n;
}
function flagged(){ return missesThisWeek()>=3; }
function adherencePct(){
  var t=0,k=0;
  for(var d=Math.max(0,S.day-6); d<=S.day; d++)
    for(var i=0;i<S.plan.length;i++){
      var st=doseStatus(d,S.plan[i].slot);
      if(st==="taken"||st==="missed"){ t++; if(st==="taken") k++; }
    }
  return t?Math.round(k/t*100):100;
}
function hasSelfStop(){ return S.alerts.some(function(a){return a.kind==="self-stop";}); }

/* ============================================================
   8. Simulated clock
   ============================================================ */

function processMoment(){
  if(!S.apptMissed && (S.day>APPOINTMENT.day || (S.day===APPOINTMENT.day && S.min>APPOINTMENT.min+60))){
    S.apptMissed=true;
    logEvent("appt","Missed the booked OPD slot — "+APPOINTMENT.label);
    notify({ title:"You missed your appointment",
             body:APPOINTMENT.label+" was booked for "+clock(APPOINTMENT.min)+". Tap to rebook.", kind:"crit" });
  }
  for(var i=0;i<S.plan.length;i++){
    var p=S.plan[i], k=dkey(S.day,p.slot), due=p.min, st=S.log[k]||"pending", m=med(p.medId);
    if(S.min>=due && !S.seen[k]){
      S.seen[k]=true;
      if(S.mode==="standard"){
        notify({ title:"Time for your "+m.name, body:clock(due)+" — "+m.why.toLowerCase()+".", kind:"warn" });
      } else if(S.tier==="green"){ S.stats.silent++; }
      else { notify({ title:"Time for your "+m.name, body:clock(due)+" — "+m.why.toLowerCase()+".", kind:"warn" }); }
    }
    if(S.mode==="standard" && st==="pending" && S.seen[k] && S.min>due && S.min<due+GRACE && (S.min-due)%NAG_EVERY===0){
      notify({ title:"Still waiting: "+m.name, body:"You haven't confirmed your "+clock(due)+" dose.", kind:"warn" });
    }
    if(S.min>=due+GRACE && st==="pending" && S.seen[k]){ S.log[k]="missed"; onMiss(p.slot); }
  }
}
/* Nobody picked up. That is a real outcome in the design, not a stuck state:
   an unanswered check-in escalates to the caregiver exactly like a declined one. */
function callUnanswered(){
  if(!S.call) return;
  var p=slotOf(S.call.slot);
  S.call=null;
  if(!p) return;
  logEvent("no-answer","No answer on the check-in call — "+S.profile.caregiver+" notified");
  S.alerts.unshift({ id:uid(), kind:"missed",
    text:S.profile.name+" didn't answer the check-in call about her "+medLabel(p)+" dose.",
    day:S.day, min:S.min, done:false });
  if(S.profile.share.alerts){
    notify({ title:S.profile.name+" didn't answer", body:"The check-in call about her "+med(p.medId).name+" went unanswered.",
             kind:"crit", to:"caregiver" });
  }
}

function rollDay(){ S.streak=0; if(S.tier!=="red") setTier("green"); logEvent("day","A new day begins"); }
function step(mins){
  var left=mins, guard=0;
  while(left>0 && guard++<400){
    var c=Math.min(15,left); S.min+=c; left-=c;
    if(S.min>=1440){ S.min-=1440; S.day++; rollDay(); }
    processMoment();
    if(S.call){
      /* only Radha can answer — for anyone else the call simply goes unanswered */
      if(role()==="patient") break;
      callUnanswered();
    }
  }
  save(); render();
}
function nextMoment(){
  var best=null;
  for(var i=0;i<S.plan.length;i++){
    var p=S.plan[i], k=dkey(S.day,p.slot);
    if(!S.seen[k] && p.min>S.min) best = best===null?p.min:Math.min(best,p.min);
    if((S.log[k]||"pending")==="pending" && p.min+GRACE>S.min)
      best = best===null?p.min+GRACE:Math.min(best,p.min+GRACE);
  }
  return best;
}
function skipToNext(){ var t=nextMoment(); if(t===null){ step(1440-S.min+START_MIN); return; } step(Math.max(15,t-S.min+1)); }

function planChanged(summary){
  S.planVersion++;
  logEvent("plan","Plan updated by "+CLINIC.doctor+" — "+summary);
  notify({ title:"Your plan has changed",
           body:CLINIC.doctor+" updated it. Tap to hear what's different.", kind:"crit", screen:"note" });
}

function orderTest(test){
  S.labOrders.unshift({ id:uid(), test:test, status:"ordered", day:S.day, min:S.min, result:"" });
  logEvent("lab-order",CLINIC.doctor+" ordered "+test);
  notify({ title:test+" has been ordered", body:"Book a slot at "+LAB.name+" when convenient.", kind:"warn", screen:"file" });
  notify({ title:"New test order", body:S.profile.name+" Iyer — "+test, kind:"warn", to:"lab" });
}

function requestRefill(medId){
  var code=String(Math.floor(100000+Math.random()*900000));
  S.refills.unshift({ id:uid(), medId:medId, code:code, status:"requested", day:S.day, min:S.min });
  logEvent("refill-order","Refill requested for "+med(medId).name);
  notify({ title:"Refill requested", body:PHARMACY.name+" will have it ready. Your code is "+code+".", kind:"calm", screen:"meds" });
  notify({ title:"New refill request", body:S.profile.name+" Iyer — "+med(medId).name, kind:"warn", to:"pharmacy" });
}

var TIER_COPY = {
  green:{ eyebrow:"On track", title:"Everything's on schedule", body:"CareLoop is logging quietly. We won't interrupt you while things are going well." },
  yellow:{ eyebrow:"Gentle nudge", title:"One dose still open", body:"No rush and nothing to worry about — just take it when you get a moment." },
  red:{ eyebrow:"Check-in", title:"Let's check in", body:"A few doses have slipped. CareLoop will call to make sure you're alright." }
};

function logoSvg(px,light){
  var c=light?"#FBF3E7":"#1F5C52";
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 48 48" aria-hidden="true">'+
    '<circle cx="18" cy="24" r="12.5" fill="none" stroke="'+c+'" stroke-width="4"/>'+
    '<circle cx="30" cy="24" r="12.5" fill="none" stroke="#F2A93B" stroke-width="4"/>'+
    '<circle cx="24" cy="24" r="3.1" fill="#D9714E"/></svg>';
}
function pillFor(t){ return '<span class="pill pill-'+t+'">'+esc(TIER_COPY[t]?TIER_COPY[t].eyebrow:t)+'</span>'; }

function weekGrid(medId){
  var slots=S.plan.filter(function(p){return !medId||p.medId===medId;});
  var days=[]; for(var d=S.day-6; d<=S.day; d++) days.push(d);
  var h='<div class="wk"><span></span>'+days.map(function(d){
    return '<span class="wk-h">'+dayName(d).slice(0,1)+'</span>'; }).join("");
  var rows=slots.map(function(p){
    return '<span class="wk-lbl">'+clock(p.min).replace(":00","")+'</span>'+
      days.map(function(d){
        var st = d<0?"none":doseStatus(d,p.slot);
        var cls = st==="taken"?"dot-taken":st==="missed"?"dot-missed":"dot-none";
        var ch  = st==="taken"?"✓":st==="missed"?"!":"";
        return '<span class="dot '+cls+'" title="'+dayName(d)+'">'+ch+'</span>';
      }).join("");
  }).join("");
  return h+rows+'</div>';
}

function supplyBlock(medId){
  var left=S.supply[medId];
  if(typeof left!=="number") return "";
  var d=daysLeft(medId), low=d<=REFILL_DAYS, open=hasOpenRefill(medId);
  var full = medId==="tel"?7:medId==="met"?30:14;
  var pct=Math.max(4,Math.min(100,Math.round(left/full*100)));
  var st="";
  for(var i=0;i<S.refills.length;i++) if(S.refills[i].medId===medId && S.refills[i].status!=="collected"){ st=S.refills[i].status; break; }
  return '<div class="stack g-xs" style="margin-top:.7rem">'+
    '<div class="between"><span class="tiny">'+left+' tablets left</span>'+
    '<span class="tiny" style="'+(low?"color:var(--terracotta-ink);font-weight:700":"")+'">'+
      (st==="ready"?"Ready to collect":st==="requested"?"Refill requested":"about "+d+" day"+(d===1?"":"s"))+'</span></div>'+
    '<div class="supply-bar'+(low?" low":"")+'"><i style="width:'+pct+'%"></i></div>'+
    (low && !open ? '<span class="btn btn-accent btn-sm" data-act="refill" data-m="'+medId+'" style="margin-top:.35rem">Request a refill</span>' : "")+
  '</div>';
}

/* 30-minute steps, so an existing 8:30 dose has an exact option to sit on.
   Whole hours only would silently snap half-hour doses the doctor never touched. */
function timeOptions(sel){
  var o="";
  for(var m=6*60; m<=22*60; m+=30)
    o+='<option value="'+m+'"'+(sel===m?" selected":"")+'>'+clock(m)+'</option>';
  return o;
}

    '<h1>Care plan</h1>'+

document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!el) return;
  var a=el.getAttribute("data-act");
  warmUp();

  /* onboarding */
  if(a==="begin"){ S.phase="onboarding"; S.step=0; save(); render(); return; }
  if(a==="ob-next"){
    if(S.step===1){ var nm=document.getElementById("nm"); if(nm&&nm.value.trim()) S.profile.name=nm.value.trim().slice(0,24); }
    if(S.step===4){ var cg=document.getElementById("cg"); if(cg&&cg.value.trim()) S.profile.caregiver=cg.value.trim().slice(0,24); }
    if(S.step>=OB_STEPS-1){
      S.phase="app"; S.screen="home"; S.locked=false;
      logEvent("setup","Setup finished at the clinic"); save(); render();
      notify({ title:"You're all set", body:"CareLoop will keep quiet unless something needs you.", kind:"calm" });
      render(); return;
    }
    S.step++; save(); render(); return;
  }
  if(a==="ob-back"){ if(S.step>0) S.step--; save(); render(); return; }
  if(a==="v-gender"){ S.profile.gender=el.getAttribute("data-v"); save(); render(); return; }
  if(a==="v-acc"){ S.profile.accent=el.getAttribute("data-v"); save(); render(); return; }
  if(a==="rel"){ S.profile.relation=el.getAttribute("data-v"); save(); render(); return; }
  if(a==="v-test"){ say("Hello "+S.profile.name+", this is the CareLoop check-in voice. This is how I will sound when I call you."); return; }
  if(a==="share"){ var k=el.getAttribute("data-k"); S.profile.share[k]=!S.profile.share[k]; save(); render(); return; }
  if(a==="cgpref"){ var ck=el.getAttribute("data-k"); S.cgPrefs[ck]=!S.cgPrefs[ck]; save(); render(); return; }
  if(a==="tsize"){ S.profile.textSize=parseInt(el.getAttribute("data-v"),10); save(); render(); return; }

  /* navigation */
  if(a==="go"){ S.screen=el.getAttribute("data-s"); S.openMed=null; save(); render(); return; }
  if(a==="dgo"){ setDscreen(el.getAttribute("data-s")); save(); render(); return; }
  if(a==="open-med"){ S.openMed=el.getAttribute("data-m"); S.screen="meds"; save(); render(); return; }
  if(a==="unlock"){ S.locked=false; save(); render(); return; }
  if(a==="open-notif"){
    var id=el.getAttribute("data-id");
    for(var i=0;i<S.notifs.length;i++) if(S.notifs[i].id===id){ S.notifs[i].read=true; S.screen=S.notifs[i].screen||"home"; }
    S.locked=false; clearBanners(); save(); render(); return;
  }
  if(a==="clear-notifs"){ S.notifs.forEach(function(n){ if(n.to===role()) n.read=true; }); save(); render(); return; }

  /* doses */
  if(a==="take"){ markDose(el.getAttribute("data-s"),"taken"); return; }
  if(a==="ask-why"){ S.reason={ slot:el.getAttribute("data-s") }; save(); render(); return; }
  if(a==="reason"){ if(S.reason) giveReason(S.reason.slot, el.getAttribute("data-v")); return; }
  if(a==="reason-cancel"){ S.reason=null; save(); render(); return; }
  if(a==="selfstop-ok"){ ackSelfStop(true); return; }
  if(a==="selfstop-no"){ ackSelfStop(false); return; }
  if(a==="selfstop-hear"){ if(S.selfStop) say(med(S.selfStop.medId).whyContinue); return; }

  /* call */
  if(a==="call-yes"){ answerCall(true); return; }
  if(a==="call-no"){ answerCall(false); return; }
  if(a==="call-better"){ answerCall("better"); return; }
  if(a==="call-replay"){ if(S.call) say(S.call.script); return; }

  /* patient misc */
  if(a==="play-note"){ say(S.visitNote); return; }
  if(a==="share-code"){
    var code=String(Math.floor(100000+Math.random()*900000));
    S.shares.unshift({ id:uid(), code:code, day:S.day, min:S.min });
    logEvent("share","One-time code "+code+" sent by SMS");
    save(); render();
    notify({ title:"Code sent to your phone", body:"Read out "+code+" to share your file once.", kind:"calm", screen:"file" });
    render(); return;
  }
  if(a==="refill"){ requestRefill(el.getAttribute("data-m")); render(); return; }
  if(a==="ack"){
    var aid=el.getAttribute("data-id");
    for(var m2=0;m2<S.alerts.length;m2++) if(S.alerts[m2].id===aid) S.alerts[m2].done=true;
    logEvent("alert-ack",S.profile.caregiver+" acknowledged and called");
    save(); render(); toast("Marked as handled"); return;
  }
  if(a==="rebook"){ S.apptMissed=false; logEvent("rebook","Missed slot released to the waitlist"); save(); render(); toast("Slot offered to the waitlist"); return; }

  /* doctor — closed loop */
  if(a==="save-plan"){
    var changes=[];
    S.plan.forEach(function(p){
      var si=document.querySelector('[data-str="'+p.slot+'"]');
      var ti=document.querySelector('[data-time="'+p.slot+'"]');
      if(si && si.value.trim() && si.value.trim()!==p.strength){ changes.push(med(p.medId).name+" now "+si.value.trim()); p.strength=si.value.trim(); }
      if(ti && parseInt(ti.value,10)!==p.min){ changes.push(med(p.medId).name+" moved to "+clock(parseInt(ti.value,10))); p.min=parseInt(ti.value,10); }
    });
    if(!changes.length){ toast("Nothing changed"); return; }
    planChanged(changes.join("; "));
    S.visitNote="Your plan has been updated. "+changes.join(". ")+". Everything else stays the same. "+
      "Please carry on as before unless "+CLINIC.doctor+" has told you otherwise.";
    save(); render(); toast("Sent to "+S.profile.name+"’s phone");
    return;
  }
  if(a==="drop-slot"){
    var ds=el.getAttribute("data-s"), dp=slotOf(ds);
    if(!dp) return;
    S.plan=S.plan.filter(function(p){return p.slot!==ds;});
    planChanged(med(dp.medId).name+" at "+clock(dp.min)+" stopped");
    S.visitNote="One change: your "+med(dp.medId).name+" at "+clock(dp.min)+" has been stopped. "+
      "Please do not take that dose any more. Everything else stays the same.";
    save(); render(); toast("Removed and sent");
    return;
  }
  if(a==="add-slot"){
    var nm2=document.getElementById("newMed"), ns=document.getElementById("newStr"), nt=document.getElementById("newTime");
    if(!nm2) return;
    var mid=nm2.value, str=(ns&&ns.value.trim())||"1 tablet", tm=parseInt(nt.value,10);
    S.plan.push({ slot:"s"+uid(), medId:mid, min:tm, strength:str });
    if(typeof S.supply[mid]!=="number" || S.supply[mid]===0) S.supply[mid]=14;
    planChanged(MEDS[mid].name+" "+str+" added at "+clock(tm));
    S.visitNote="Something new has been added: "+MEDS[mid].name+" "+str+", at "+clock(tm)+". "+
      MEDS[mid].how+" Everything else stays the same.";
    save(); render(); toast("Added and sent to her phone");
    return;
  }
  if(a==="order-test"){
    var nt2=document.getElementById("newTest");
    if(!nt2) return;
    orderTest(nt2.value); save(); render(); toast("Order sent to "+LAB.name);
    return;
  }
  if(a==="save-note"){
    var vn=document.getElementById("vn");
    if(vn && vn.value.trim()) S.visitNote=vn.value.trim();
    logEvent("note","Visit note recorded by "+CLINIC.doctor);
    notify({ title:"A new note from "+CLINIC.doctor, body:"Tap to listen — about 30 seconds.", kind:"warn", screen:"note" });
    save(); render(); toast("Sent to "+S.profile.name+"’s phone");
    return;
  }
  if(a==="preview-note"){ var vn2=document.getElementById("vn"); say(vn2?vn2.value:S.visitNote); return; }

  /* pharmacy */
  if(a==="ph-ready"){
    var rid=el.getAttribute("data-id");
    S.refills.forEach(function(r){ if(r.id===rid) r.status="ready"; });
    var rr=S.refills.filter(function(r){return r.id===rid;})[0];
    logEvent("refill-ready",med(rr.medId).name+" ready at "+PHARMACY.name);
    notify({ title:med(rr.medId).name+" is ready", body:"Collect from "+PHARMACY.name+" — show code "+rr.code+".", kind:"calm", screen:"meds" });
    save(); render(); toast("Patient told it's ready"); return;
  }
  if(a==="ph-collect"){
    var cid=el.getAttribute("data-id");
    S.refills.forEach(function(r){ if(r.id===cid){ r.status="collected";
      S.supply[r.medId]=(S.supply[r.medId]||0)+30; S.refillWarned[r.medId]=false; } });
    logEvent("refill-collected","Refill dispensed at "+PHARMACY.name);
    save(); render(); toast("Dispensed — supply topped up"); return;
  }
  if(a==="ph-verify"){
    var inp=document.getElementById("pcode"), out=document.getElementById("verifyOut");
    if(!inp||!out) return;
    var v=inp.value.trim();
    var okShare=S.shares.some(function(s){return s.code===v;});
    var okRefill=S.refills.some(function(r){return r.code===v;});
    if(okShare||okRefill){
      out.innerHTML='<div class="card stack g-sm" style="max-width:520px"><div class="row g-sm"><span style="font-size:1.3rem">✅</span>'+
        '<div><h3 style="margin:0">'+esc(S.profile.name)+' Iyer</h3><div class="tiny">Access granted for this visit only</div></div></div>'+
        '<div class="tbl-wrap"><table class="dt"><tbody>'+S.files.map(function(f){
          return '<tr><td><strong>'+esc(f.l)+'</strong></td><td class="tiny">'+esc(f.t)+'</td><td class="tiny">'+esc(f.d)+'</td></tr>'; }).join("")+
        '</tbody></table></div><p class="tiny">The patient can revoke this at any time. Nothing is stored here.</p></div>';
    } else {
      out.innerHTML='<div class="flagbox flag-red" style="max-width:520px"><strong>That code isn’t valid.</strong><br />'+
        'Codes are single-use and expire. Ask the patient to generate a fresh one from their health file.</div>';
    }
    return;
  }

  /* lab */
  if(a==="lab-collect"){
    var lid=el.getAttribute("data-id");
    S.labOrders.forEach(function(o){ if(o.id===lid) o.status="collected"; });
    logEvent("lab","Sample collected at "+LAB.name);
    notify({ title:"Sample collected", body:"Your result will appear in your health file.", kind:"calm", screen:"file" });
    save(); render(); toast("Marked collected"); return;
  }
  if(a==="lab-result"){
    var rid2=el.getAttribute("data-id");
    var vals={ "HbA1c":"7.6% — slightly raised", "Lipid profile":"LDL 118 mg/dL — borderline",
               "Serum creatinine":"0.9 mg/dL — normal", "Fasting blood sugar":"132 mg/dL — raised",
               "Liver function":"Within normal limits" };
    S.labOrders.forEach(function(o){
      if(o.id===rid2){
        o.status="resulted";
        o.result=vals[o.test]||"Within normal limits";
        S.files.unshift({ t:"Lab report", l:o.test+" — "+o.result, d:dayLabel(S.day) });
      }
    });
    logEvent("lab-result","Result uploaded by "+LAB.name);
    notify({ title:"Your result is ready", body:"It's in your health file, and Dr. Rao can see it.", kind:"calm", screen:"file" });
    save(); render(); toast("Result sent to patient and doctor"); return;
  }

  /* simulation */
  if(a==="sim-hour"){ step(60); return; }
  if(a==="sim-next"){ skipToNext(); return; }
  if(a==="sim-lock"){ S.locked=!S.locked; save(); render(); return; }
  if(a==="sim-mode"){ S.mode=S.mode==="tiered"?"standard":"tiered";
    logEvent("mode","Switched to "+(S.mode==="standard"?"a typical reminder app":"CareLoop's tiered system"));
    save(); render(); return; }

  /* facilitator */
  if(a==="restart"){ hush(); try{localStorage.removeItem(KEY);}catch(e){} S=seed(fresh()); clearBanners(); save(); render(); return; }
  if(a==="fac-miss"){
    var ds2=todayDoses(), t=null;
    for(var z=0;z<ds2.length;z++) if(ds2[z].status==="pending"){ t=ds2[z].p.slot; break; }
    if(!t){ S.day++; S.min=START_MIN; rollDay(); t=S.plan[0].slot; }
    S.seen[dkey(S.day,t)]=true; markDose(t,"missed"); return;
  }
  if(a==="fac-call"){
    var d3=todayDoses(), t2=d3.length?d3[0].p.slot:null;
    for(var y=0;y<d3.length;y++) if(d3[y].status==="pending"){ t2=d3[y].p.slot; break; }
    if(t2){ setTier("red"); startCall(t2); save(); render(); } return;
  }
  if(a==="fac-green"){ setTier("green"); S.streak=0; save(); render(); return; }
  if(a==="fac-day"){ S.day++; S.min=START_MIN; rollDay(); save(); render(); return; }
  if(a==="fac-scenario"){
    if(S.plan[1]) S.log[dkey(S.day-2,S.plan[1].slot)]="missed";
    if(S.plan[2]) S.log[dkey(S.day-1,S.plan[2].slot)]="missed";
    if(S.plan[0]){ S.log[dkey(S.day,S.plan[0].slot)]="missed"; S.seen[dkey(S.day,S.plan[0].slot)]=true; }
    setTier("red"); S.streak=2;
    logEvent("pattern","Three misses inside a week — flagged to the clinic");
    save(); render(); return;
  }
});

/* keep other open tabs in step — this is what makes the closed loop legible */
window.addEventListener("storage", function(e){
  if(e.key!==KEY) return;
  S=load(); render();
});
window.addEventListener("hashchange", function(){ render(); });

/* ============================================================
   19. Boot
   ============================================================ */

S=load();
if(role()!=="patient" && S.phase!=="app"){ S.phase="app"; }   /* professionals don't onboard as Radha */
render();
if("speechSynthesis" in window){
  window.setTimeout(function(){ loadVoices();
    if(role()==="patient" && ((S.phase==="onboarding"&&S.step===3)||S.screen==="settings")) render(); },700);
}

})();
</script>
